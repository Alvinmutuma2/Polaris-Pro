  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;
    background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
  .bar h1{font-size:15px;font-weight:600;margin:0;flex:1;text-align:center;letter-spacing:.2px}
  .ico{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--ink)}
  .ico:active{transform:scale(.96)}
  .ico.ghost{border-color:transparent;background:transparent}
  .lang{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid #d4e3da;
    border-radius:999px;padding:7px 11px;cursor:pointer;letter-spacing:.04em}
  main{flex:1;padding:20px 16px 24px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .lead{color:var(--muted);margin:0 0 20px;font-size:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .door{display:flex;gap:13px;align-items:flex-start}
  .door .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .door b{display:block;font-size:15px;margin-bottom:2px}
  .door span{color:var(--muted);font-size:13.5px}
  .opt{display:flex;align-items:center;gap:12px;padding:15px 14px;background:var(--surface);border:1px solid var(--line);

  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .k{flex:none;width:34px;height:34px;border-radius:9px;background:#f0efe9;display:flex;align-items:center;justify-content:center;font-size:17px}
  .opt .t{flex:1}
  .opt .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;font-size:16px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;margin-top:6px}
  .btn:active{transform:scale(.99)}
  .btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .footer{padding:14px 16px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
  .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line input.lbl{flex:1;border:0;background:transparent;font-size:15px;color:var(--ink);outline:none;padding:4px}
  .line input.amt{width:92px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;font-size:15px;outline:none}
  .line input.amt:focus{border-color:var(--accent)}
  .toggle{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11.5px;
    padding:6px 10px;cursor:pointer;min-width:74px;text-align:center;font-weight:600}
  .toggle.pen{color:var(--pen);border-color:var(--pen)}
  .toggle.pencil{color:var(--pencil);border-color:#d9dde1}
  .addline{border:1px dashed var(--line);background:transparent;color:var(--muted);width:100%;padding:11px;border-radius:10px;cursor:pointer;margin-top:10px;font-size:14px}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}

  .stat .c{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
  .stat .c small{color:var(--muted);font-size:12px;display:block;margin-bottom:4px}
  .stat .c b{font-size:19px;font-weight:700}

  .rec small{color:var(--muted);font-size:12.5px;display:block}
  .menu-item{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer;color:var(--ink)}

  .status.ok{background:var(--accent-soft);color:#2c4a40}
  .status.lock{background:#f3ece2;color:var(--warn)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}

  .hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px}

  .promo .t{flex:1}
  .promo .t b{display:block;font-size:15px}
  .promo .t small{color:var(--muted);font-size:13px}
  .promo .arr{color:var(--muted);font-size:20px}
  .flipwrap{perspective:1200px;margin:6px 0 16px}
  .flipcard{position:relative;width:100%;height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .flipcard.flip{transform:rotateY(180deg)}
  .cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}
  .cfront{background:linear-gradient(135deg,#2b3640,#1c2630 55%,#0f151b);color:#f6f5f1;border:1px solid #3a4652}
  .cback{background:#fff;border:1px solid var(--line);transform:rotateY(180deg)}
  .cbrand{font-size:27px;font-weight:800;letter-spacing:.02em}
  .ctag{color:#c6c8c5;font-size:14px;margin-top:6px}
  .cfliphint{position:absolute;bottom:12px;font-size:10.5px;color:#8b95a1;letter-spacing:.09em;text-transform:uppercase}
  .cqr{width:148px;height:148px;image-rendering:pixelated}
  .cnum{font-weight:700;margin-top:8px;font-size:15px;color:var(--ink)}
  .cscan{font-size:12px;color:var(--muted);margin-top:2px}
  .tabbar{display:flex;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
  .tab{flex:1;border:0;background:transparent;padding:9px 2px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer}
  .tab span{font-size:19px;line-height:1}
  .tab.on{color:var(--accent);font-weight:600}
  #installmodal{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:24px}

  @media print{.bar,.footer,.tabbar,#installmodal{display:none}}

function load(){try{const r=JSON.parse(localStorage.getItem("pp_state"));const st=r&&r.branches?r:structuredClone(BLANK);if(!st.lang)st.lang="en";return st;}catch(e){return structuredClone(BLANK);}}
function save(){localStorage.setItem("pp_state",JSON.stringify(S));}
function t(k){const o=L[k];if(o==null)return k;return o[S.lang]||o.en;}
function toggleLang(){S.lang=S.lang==="sw"?"en":"sw";save();render();}
function go(sc){S.hist.push(S.screen);S.screen=sc;save();render();}
function goTab(id){S.screen=id;S.hist=[];save();render();}
function back(){S.screen=S.hist.pop()||"home";save();render();}
function reset(){if(confirm(t("resetConfirm"))){const lang=S.lang;S=structuredClone(BLANK);S.lang=lang;save();render();}}
function money(n){return "KES "+Math.round(n||0).toLocaleString();}
function todayStr(){return new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function daysLeft(){if(!S.paidThrough)return 0;return Math.ceil((new Date(S.paidThrough)-new Date())/86400000);}
function isLive(){return S.pro&&daysLeft()>0;}
function branchName(id){const b=S.branches.find(x=>x.id===id);return b?b.name:"—";}
function openLink(u){window.open(u,"_blank","noopener");}
function recName(k){return t("rec_"+k+"_t");}

function sampleLines(recipe){
  if(recipe==="timber")return[{label:"4x2x12",L:4,W:2,H:12},{label:"6x1x10",L:6,W:1,H:10},{label:"2x2x14",L:2,W:2,H:14}];
  if(recipe==="paidowed")return[{label:"Unga 2kg",amount:540,kind:"pen"},{label:"Mafuta 1L",amount:320,kind:"pen"},{label:"Sukari 2kg (Mama Njeri)",amount:280,kind:"pencil"},{label:"Mkate + maziwa",amount:170,kind:"pen"}];
  return[{label:"Till asubuhi",amount:3150,kind:"pen"},{label:"Till mchana",amount:2680,kind:"pen"},{label:"Till jioni",amount:1940,kind:"pen"}];
}
function bf(r){return Math.trunc(((+r.L||0)*(+r.W||0)*(+r.H||0))/12);}
function draftTotals(){
  const d=S.draft;if(!d)return{total:0,collected:0,owed:0,bfeet:0};
  if(d.recipe==="timber"){let feet=d.lines.reduce((s,r)=>s+bf(r),0)+(d.extraBf||0);const rate=d.mvule?RATE_MVULE:RATE_TIMBER;return{bfeet:feet,total:feet*rate,collected:0,owed:0};}
  let total=0,collected=0,owed=0;d.lines.forEach(l=>{const a=+l.amount||0;total+=a;if(l.kind==="pencil")owed+=a;else collected+=a;});
  return{total,collected,owed,bfeet:0};
}

function topbar(title,opts={}){

  const sh=opts.share===false?'':`<div class="ico" onclick="go('share')" title="Share">📤</div>`;
  return `<div class="bar">${b}<h1>${title}</h1>${sh}${langBtn()}</div>`;
}

  const tb=(id,ic,lb)=>`<button class="tab ${S.screen===id?'on':''}" onclick="goTab('${id}')"><span>${ic}</span>${lb}</button>`;

  const d=S.draft,tt=draftTotals();let body;
  if(d.recipe==="timber"){
    body=d.lines.map((r,i)=>`<div class="line"><input class="lbl" placeholder="4x2x12" value="${r.label}" oninput="setT(${i},'label',this.value)"><input class="amt num" style="width:46px" placeholder="U" value="${r.L}" onchange="setT(${i},'L',this.value)"><input class="amt num" style="width:46px" placeholder="P" value="${r.W}" onchange="setT(${i},'W',this.value)"><input class="amt num" style="width:46px" placeholder="K" value="${r.H}" onchange="setT(${i},'H',this.value)"><span class="chip num">${bf(r)} bf</span></div>`).join("");
    body+=`<div class="line"><span style="flex:1;color:var(--muted);font-size:13px">${t('mvuleQ')}</span><button class="toggle ${d.mvule?'pen':'pencil'}" onclick="S.draft.mvule=!S.draft.mvule;save();render()">${d.mvule?'Mvule ·180':'·120'}</button></div>`;
    body+=`<button class="addline" onclick="addTimber()">${t('addSize')}</button>`;
  }else{
    body=d.lines.map((l,i)=>`<div class="line"><input class="lbl" placeholder="${t('itemOrTill')}" value="${l.label}" oninput="setL(${i},'label',this.value)"><input class="amt num" placeholder="0" value="${l.amount}" onchange="setL(${i},'amount',this.value)">${d.recipe==="paidowed"?`<button class="toggle ${l.kind==='pencil'?'pencil':'pen'}" onclick="flip(${i})">${l.kind==='pencil'?t('owedTog'):t('paidTog')}</button>`:''}</div>`).join("");
    body+=`<button class="addline" onclick="addLine()">${t('addLine')}</button>`;
  }
  const tl=d.recipe==="timber"?`${tt.bfeet} bf → ${money(tt.total)}`:money(tt.total);
  const pic=(d.photoData)?`<img src="${d.photoData}" style="width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;max-height:220px;object-fit:cover">`:'';
  return topbar(t('reviewTitle'))+`<main>
    <p class="eyebrow">${t('reviewStep')}</p><h2>${t('reviewTitle')}</h2>
    <p class="lead">${t('reviewLead')}</p>
    ${pic}
    <div class="card">${body}<div class="total-row"><span class="chip">${t('total')}</span><span class="big num">${tl}</span></div></div>
    ${d.recipe==="paidowed"?`<div class="priv"><div>✎</div><div><b>${t('paidOwedT')}</b> ${t('paidOwedB')}</div></div>`:''}
  </main><div class="footer"><button class="btn" onclick="saveRecord()">${t('confirmSave')}</button></div>`;
}
function setL(i,k,v){S.draft.lines[i][k]=k==='amount'?(+v||0):v;save();render();}
function flip(i){const l=S.draft.lines[i];l.kind=l.kind==='pencil'?'pen':'pencil';save();render();}
function addLine(){S.draft.lines.push({label:"",amount:"",kind:"pen"});save();render();}
function addTimber(){S.draft.lines.push({label:"",L:"",W:"",H:""});save();render();}
function setT(i,k,v){S.draft.lines[i][k]=k==='label'?v:(+v||0);save();render();}
function saveRecord(){const tt=draftTotals();S.records.unshift({id:"r"+Date.now(),date:todayStr(),branch:S.branch,recipe:S.draft.recipe,total:tt.total,collected:tt.collected,owed:tt.owed,bfeet:tt.bfeet,photo:S.draft.photoData||null});S.draft=null;S.recipeChoice=null;save();go("result");}
function screen_result(){
  const r=S.records[0];if(!r){S.screen="records";return render();}
  const proTag=isLive()?'':'<span class="chip pro">Pro</span>';
  return topbar(t('savedTitle'))+`<main>
    <p class="eyebrow">${branchName(r.branch)} · ${r.date}</p><h2>${t('savedTitle')}</h2>
    ${r.photo?`<img src="${r.photo}" style="width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:12px;max-height:200px;object-fit:cover">`:''}
    <div class="card"><div class="total-row"><span>${r.recipe==='timber'?t('value'):t('totalSales')}</span><span class="big num">${money(r.total)}</span></div></div>
    ${r.recipe!=='timber'?`<div class="stat"><div class="c"><small>${t('collectedPen')}</small><b class="num" style="color:var(--pen)">${money(r.collected)}</b></div><div class="c"><small>${t('owedPencil')}</small><b class="num" style="color:var(--pencil)">${money(r.owed)}</b></div></div>`:`<div class="card"><div class="total-row"><span>${t('boardFeet')}</span><span class="num">${r.bfeet} bf</span></div></div>`}
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn sec" style="margin-top:0" onclick="shareRecord()">📤 ${t('shareBtn')}</button>
      <button class="btn sec" style="margin-top:0" onclick="makePDF()">🖨 ${t('makePDF')} ${proTag}</button>
    </div>
    <div class="priv"><div>🔒</div><div>${t('resultPriv')}</div></div>
  </main><div class="footer"><button class="btn" onclick="goTab('records')">${t('seeRecords')}</button><button class="btn sec" onclick="go('capture')" style="margin-top:8px">${t('recordAnother')}</button></div>`;
}
function shareRecord(){
  const r=S.records[0];if(!r)return;
  let txt="Polaris — "+(S.lang==="sw"?"mauzo ":"sales ")+r.date+": "+money(r.total);
  if(r.recipe!=='timber')txt+=" ("+t('collectedPen')+": "+money(r.collected)+", "+t('owedPencil')+": "+money(r.owed)+")";
  if(navigator.share){navigator.share({title:"Polaris Pro",text:txt}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert(t('copied')+txt));}
  else{alert(txt);}
}
function makePDF(){if(!isLive()){goTab('pro');return;}window.print();}
function screen_branches(){
  const rows=S.branches.map(b=>`<div class="rec"><div onclick="S.branch='${b.id}';S._all=false;save();render()" style="cursor:pointer">${b.name} ${S.branch===b.id?`<span class="chip">${t('current')}</span>`:''}</div></div>`).join("");
  const note=isLive()?'':`<div class="status lock">${t('branchProNote')}</div>`;
  return topbar(t('miBranches'))+`<main><p class="eyebrow">${t('mgmt')}</p><h2>${t('yourBranches')}</h2>
    <p class="lead">${t('branchesLead')}</p>${note}
    <div class="card" style="padding:4px 16px">${rows}</div>
    <input class="field" id="bn" placeholder="${t('newBranchPh')}" style="margin-top:14px">
  </main><div class="footer"><button class="btn" onclick="addBranch()">${t('addBranch')}</button></div>`;
}
function addBranch(){const v=(document.getElementById("bn").value||"").trim();if(!v)return;S.branches.push({id:"b"+Date.now(),name:v});save();render();}
function screen_privacy(){
  return topbar(t('miPrivacy'))+`<main><p class="eyebrow">${t('promise')}</p><h2>${t('bookYours')}</h2>
    <div class="card">✒ <b>${t('paperPaper')}</b><br><span style="color:var(--muted);font-size:14px">${t('paperBody')}</span></div>
    <div class="card">💵 <b>${t('neverCash')}</b><br><span style="color:var(--muted);font-size:14px">${t('cashBody')}</span></div>
    <div class="card">🙈 <b>${t('numbersPrivate')}</b><br><span style="color:var(--muted);font-size:14px">${t('numbersBody')}</span></div>
  </main><div class="footer"><button class="btn" onclick="back()">${t('gotIt')}</button></div>`;
}
async function submitPay(){
  const phone=(document.getElementById("pphone").value||"").replace(/\s/g,"").trim();
  const code=(document.getElementById("code").value||"").trim().toUpperCase();
  if(!/^(?:\+?254|0)(7|1)\d{8}$/.test(phone)){alert(t('phoneAlert'));return;}
  if(!/^[A-Z0-9]{10,12}$/.test(code)){alert(t('codeAlert'));return;}
  try{
    await rpc('pro_request',{p_phone:phone,p_tier:(S.proTier||'pro'),p_code:code});
    S.proPhone=phone;save();alert(t('sentPending'));render();
  }catch(e){alert(t('needLive'));}
}
async function checkPro(silent){
  if(!S.proPhone)return;
  try{
    const rows=await rpc('pro_status',{p_phone:S.proPhone});
    const row=(Array.isArray(rows)&&rows.length)?rows[0]:null;
    if(row&&row.active){S.pro=true;S.paidThrough=row.paid_through;save();render();if(!silent)alert(t('proUnlocked'));}
    else{if(!silent)alert(t('notConfirmed'));}
  }catch(e){if(!silent)alert(t('needLive'));}
}
function screen_share(){
  return topbar(t('shareTitle'),{share:false})+`<main>
    <div class="flipwrap" onclick="this.querySelector('.flipcard').classList.toggle('flip')">
      <div class="flipcard">
        <div class="cface cfront">
          <div class="cbrand">Polaris Pro</div>
          <div class="ctag">${t('tagline')}</div>
          <div class="cfliphint">${t('tapTurn')}</div>
        </div>
        <div class="cface cback">
          <img src="${QR_APP}" class="cqr" alt="QR">
          <div class="cnum">+254 759 610 468</div>
          <div class="cscan">${t('scanOpen')}</div>
        </div>
      </div>
    </div>
    <button class="btn" onclick="shareApp()">📤 ${t('shareApp')}</button>
    <button class="btn sec" onclick="openLink(COMMUNITY)" style="margin-top:8px">💬 ${t('joinComm')}</button>
    <button class="btn sec" onclick="openLink(WA)" style="margin-top:8px">${t('messageMe')}</button>
    <div class="priv"><div>↗</div><div>${t('shareNote')}</div></div>
  </main>`;
}
function shareApp(){
  const txt=(S.lang==='sw'?'Jaribu Polaris Pro — andika mauzo ya duka lako: ':'Try Polaris Pro — record your shop sales: ')+PRO_URL;
  if(navigator.share){navigator.share({title:'Polaris Pro',text:txt,url:PRO_URL}).catch(()=>{});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>alert(t('copied')+txt));}
  else alert(txt);
}

/* ---- guided tour ---- */
const TOUR=[
  {s:'home',en:"Welcome 👋 This is Polaris Pro. Let me walk you through the whole thing — about 15 seconds.",sw:"Karibu 👋 Hii ni Polaris Pro. Nikuonyeshe kila kitu — sekunde 15 hivi."},
  {s:'home',en:"Everything lives in these 5 tabs at the bottom: Home, Records, Explore, Pro, More. Tap any, anytime.",sw:"Kila kitu kiko kwenye vichupo 5 hapa chini: Nyumbani, Rekodi, Gundua, Pro, Zaidi. Gusa chochote, wakati wowote."},
  {s:'capture',en:"To record a day, snap a photo of your paper page. I've dropped a sample page in for you.",sw:"Kurekodi siku, piga picha ya ukurasa wako. Nimeweka ukurasa wa mfano kwa ajili yako.",setup(){S.draft={photoName:'sample page (demo)',photoData:null};}},
  {s:'recipe',en:"Then tell Polaris what to do with it. I picked 'Total my sales' — but you choose.",sw:"Kisha ambia Polaris la kufanya nayo. Nimechagua 'Jumlisha mauzo' — lakini wewe chagua.",setup(){S.recipeChoice='sales';}},
  {s:'review',en:"Last step: check the numbers, then tap Confirm & save. Ready to try it yourself?",sw:"Hatua ya mwisho: angalia nambari, kisha gusa Thibitisha na hifadhi. Uko tayari kujaribu mwenyewe?",setup(){S.draft=S.draft||{};S.draft.recipe='sales';S.draft.lines=sampleLines('sales');S.draft.mvule=false;},last:true}
];
function tourStart(){S.seenTour=true;S.tour={active:true,step:0};applyTour();}
function applyTour(){const st=TOUR[S.tour.step];if(st.setup)st.setup();S.screen=st.s;save();render();}
function tourNext(){if(TOUR[S.tour.step].last){S.tour.active=false;save();render();return;}S.tour.step++;applyTour();}
function tourSkip(){S.tour.active=false;S.draft=null;S.recipeChoice=null;S.screen='home';save();render();}
function tourOverlay(){
  if(!S.tour||!S.tour.active)return '';
  const st=TOUR[S.tour.step],last=st.last,txt=st[S.lang]||st.en;
  return `<div style="position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none">
   <div style="max-width:440px;width:100%;padding:16px;pointer-events:auto">
    <div style="background:var(--ink);color:#fff;border-radius:14px;padding:15px 16px 13px;box-shadow:0 8px 30px rgba(0,0,0,.25)">
      <div style="font-size:11px;letter-spacing:.1em;opacity:.55;margin-bottom:6px">${S.lang==='sw'?'MWONGOZO':'GUIDE'} · ${S.tour.step+1}/${TOUR.length}</div>
      <div style="font-size:15px;line-height:1.5;margin-bottom:12px">${txt}</div>
      <div style="display:flex;gap:10px">
        <button onclick="tourSkip()" style="flex:none;background:transparent;border:1px solid #3a4652;color:#cdd3da;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer">${S.lang==='sw'?'Ruka':'Skip'}</button>
        <button onclick="tourNext()" style="flex:1;background:#fff;color:var(--ink);border:0;border-radius:10px;padding:10px;font-size:15px;font-weight:600;cursor:pointer">${last?(S.lang==='sw'?'Sawa — zamu yangu':'Got it — my turn'):(S.lang==='sw'?'Endelea':'Next')}</button>
      </div>
    </div></div></div>`;
}
function render(){
  const flow={capture:screen_capture,recipe:screen_recipe,review:screen_review,result:screen_result,branches:screen_branches,privacy:screen_privacy,share:screen_share};
  const top={home:page_home,records:page_records,explore:page_explore,pro:page_pro,more:page_more};
  let html;
  if(TOP.includes(S.screen)){html=topbar("Polaris Pro",{noback:true})+top[S.screen]()+tabbar();}
  else{html=(flow[S.screen]||page_home)();}
  document.getElementById("app").innerHTML=html+tourOverlay();window.scrollTo(0,0);
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}

/* ---- install nudge (keeps popping until installed) ---- */
var deferredPrompt=null;
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installEligible(){return !isStandalone() && !localStorage.getItem('pp_installed') && !(S.tour&&S.tour.active);}
function showInstallModal(){
  if(!installEligible())return;
  var m=document.getElementById('installmodal');if(!m)return;
  var sw=(S.lang==='sw');
  document.getElementById('im-title').textContent=sw?'Sakinisha Polaris Pro':'Install Polaris Pro';
  document.getElementById('im-sub').textContent=sw?'Iweke kwenye skrini yako kama programu — inafunguka haraka, hata bila mtandao.':'Add it to your home screen like an app — opens fast, even offline.';
  var ib=document.getElementById('im-install');ib.textContent=sw?'Sakinisha sasa':'Install now';ib.onclick=installClick;
  var lb=document.getElementById('im-later');lb.textContent=sw?'Baadaye':'Not now';lb.onclick=function(){m.style.display='none';};
  m.style.display='flex';
}
function hideInstallModal(){var m=document.getElementById('installmodal');if(m)m.style.display='none';}
function installClick(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(c){if(c&&c.outcome==='accepted'){localStorage.setItem('pp_installed','1');hideInstallModal();}deferredPrompt=null;});}
  else{alert((S.lang==='sw')?'Fungua kwenye Chrome → menyu (⋮) → Sakinisha programu / Ongeza kwenye skrini':'Open in Chrome → menu (⋮) → Install app / Add to Home screen');}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;showInstallModal();});
window.addEventListener('appinstalled',function(){localStorage.setItem('pp_installed','1');deferredPrompt=null;hideInstallModal();});
setTimeout(function(){var m=document.getElementById('installmodal');if(installEligible()&&m&&m.style.display!=='flex')showInstallModal();},3500);
if(S.proPhone){checkPro(true);}
</script>
</body>
