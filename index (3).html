<style>
  :root{
    --bg:#f6f5f1; --surface:#ffffff; --ink:#1c2630; --muted:#737d88;
    --line:#e6e2da; --accent:#2e5e4e; --accent-soft:#e7efe9;
    --pen:#1c2630; --pencil:#9aa3ad; --warn:#9a5a2e; --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
  .num{font-family:ui-monospace,"SF Mono",Menlo,monospace}
  .wrap{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
  .bar{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;
    background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
  .bar h1{font-size:15px;font-weight:600;margin:0;flex:1;text-align:center;letter-spacing:.2px}
  .ico{width:38px;height:38px;border:1px solid var(--line);background:var(--surface);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;color:var(--ink)}
  .ico:active{transform:scale(.96)}
  .ico.ghost{border-color:transparent;background:transparent}
  .lang{font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid #d4e3da;
    border-radius:999px;padding:7px 11px;cursor:pointer;letter-spacing:.04em}
  main{flex:1;padding:20px 16px 24px}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  h2{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  .lead{color:var(--muted);margin:0 0 20px;font-size:15px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .door{display:flex;gap:13px;align-items:flex-start}
  .door .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
  .door b{display:block;font-size:15px;margin-bottom:2px}
  .door span{color:var(--muted);font-size:13.5px}
  .opt{display:flex;align-items:center;gap:12px;padding:15px 14px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;font-size:15px;color:var(--ink)}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  .opt .k{flex:none;width:34px;height:34px;border-radius:9px;background:#f0efe9;display:flex;align-items:center;justify-content:center;font-size:17px}
  .opt .t{flex:1}
  .opt .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
  .btn{display:block;width:100%;padding:15px;border-radius:12px;border:0;font-size:16px;font-weight:600;
    cursor:pointer;background:var(--accent);color:#fff;margin-top:6px}
  .btn:active{transform:scale(.99)}
  .btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .footer{padding:14px 16px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
  .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .line input.lbl{flex:1;border:0;background:transparent;font-size:15px;color:var(--ink);outline:none;padding:4px}
  .line input.amt{width:92px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;font-size:15px;outline:none}
  .line input.amt:focus{border-color:var(--accent)}
  .toggle{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11.5px;
    padding:6px 10px;cursor:pointer;min-width:74px;text-align:center;font-weight:600}
  .toggle.pen{color:var(--pen);border-color:var(--pen)}
  .toggle.pencil{color:var(--pencil);border-color:#d9dde1}
  .tline input.lbl{flex:1;min-width:0;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:15px;color:var(--ink);outline:none;padding:6px 2px}
  .tline input.lbl:focus{border-bottom-color:var(--accent)}
  .tline input.amt{border:1px solid var(--line);border-radius:8px;padding:8px;text-align:right;font-size:15px;outline:none;background:var(--surface)}
  .tline input.amt:focus{border-color:var(--accent)}
  .addline{border:1px dashed var(--line);background:transparent;color:var(--muted);width:100%;padding:11px;border-radius:10px;cursor:pointer;margin-top:10px;font-size:14px}
  .total-row{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}
  .total-row .big{font-size:26px;font-weight:700}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 9px;border-radius:999px;background:#f0efe9;color:var(--muted)}
  .chip.pro{background:#efe7dc;color:var(--warn)}
  .stat{display:flex;gap:10px;margin:14px 0}
  .stat .c{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px}
  .stat .c small{color:var(--muted);font-size:12px;display:block;margin-bottom:4px}
  .stat .c b{font-size:19px;font-weight:700}
  .thumb{height:160px;border-radius:12px;border:1px solid var(--line);background:#f0efe9 center/cover no-repeat;
    display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;margin-bottom:12px;overflow:hidden;text-align:center;padding:12px;cursor:pointer}
  .priv{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border:1px solid #d4e3da;border-radius:12px;padding:13px;font-size:13px;color:#2c4a40;margin-top:14px}
  .rec{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .rec small{color:var(--muted);font-size:12.5px;display:block}
  .menu-item{display:flex;align-items:center;gap:12px;padding:15px 2px;border-bottom:1px solid var(--line);font-size:16px;cursor:pointer;color:var(--ink)}
  .status{font-size:13px;padding:11px 13px;border-radius:10px;margin-bottom:14px}
  .status.ok{background:var(--accent-soft);color:#2c4a40}
  .status.lock{background:#f3ece2;color:var(--warn)}
  .seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:14px}
  .seg button{flex:1;padding:10px;border:0;background:var(--surface);font-size:13.5px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  label.f{font-size:13px;color:var(--muted);display:block;margin:2px 0 6px}
  input.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:15px;outline:none;margin-bottom:12px}
  input.field:focus{border-color:var(--accent)}
  .hint{font-size:12.5px;color:var(--muted);margin-top:-6px;margin-bottom:12px}
  .promo{display:flex;gap:13px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
  .promo .logo{flex:none;width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff}
  .promo .t{flex:1}
  .promo .t b{display:block;font-size:15px}
  .promo .t small{color:var(--muted);font-size:13px}
  .promo .arr{color:var(--muted);font-size:20px}
  .flipwrap{perspective:1200px;margin:6px 0 16px}
  .flipcard{position:relative;width:100%;height:220px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .flipcard.flip{transform:rotateY(180deg)}
  .cface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;overflow:hidden}
  .cfront{background:linear-gradient(135deg,#2b3640,#1c2630 55%,#0f151b);color:#f6f5f1;border:1px solid #3a4652}
  .cback{background:#fff;border:1px solid var(--line);transform:rotateY(180deg)}
  .cbrand{font-size:27px;font-weight:800;letter-spacing:.02em}
  .ctag{color:#c6c8c5;font-size:14px;margin-top:6px}
  .cfliphint{position:absolute;bottom:12px;font-size:10.5px;color:#8b95a1;letter-spacing:.09em;text-transform:uppercase}
  .cqr{width:148px;height:148px;image-rendering:pixelated}
  .cnum{font-weight:700;margin-top:8px;font-size:15px;color:var(--ink)}
  .cscan{font-size:12px;color:var(--muted);margin-top:2px}
  .tabbar{display:flex;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6}
  .tab{flex:1;border:0;background:transparent;padding:9px 2px calc(9px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);cursor:pointer}
  .tab span{font-size:19px;line-height:1}
  .tab.on{color:var(--accent);font-weight:600}
  #installmodal,#trackerintro{position:fixed;inset:0;z-index:50;background:rgba(10,15,20,.55);display:none;align-items:center;justify-content:center;padding:24px}
  #installmodal .m,#trackerintro .m{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 22px;max-width:360px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #installmodal .mi,#trackerintro .mi{font-size:42px;margin-bottom:4px}
  #installmodal .mt,#trackerintro .mt{font-size:19px;font-weight:700;margin-bottom:6px}
  #installmodal .ms,#trackerintro .ms{color:var(--muted);font-size:14px;margin-bottom:16px}
  #compass{position:fixed;right:16px;bottom:82px;z-index:35;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#3f8169,var(--accent));color:#fff;border:0;font-size:24px;display:none;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(46,94,78,.5);cursor:pointer;animation:cfloat 3.2s ease-in-out infinite}
  #compass:active{transform:scale(.94)}
  @keyframes cfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
  #trackerpanel{position:fixed;inset:0;z-index:45;background:rgba(10,15,20,.55);display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
  #trackerpanel .sheet{background:var(--surface);width:100%;max-width:440px;height:90vh;border-radius:22px 22px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -12px 44px rgba(0,0,0,.3)}
  .chead{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
  .chead .av{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 30% 28%,#3f8169,var(--accent));color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 4px 12px rgba(46,94,78,.45)}
  .chead .ti{flex:1}
  .chead .ti b{font-size:15.5px;display:block;line-height:1.1}
  .chead .ti small{color:var(--accent);font-size:11.5px;display:inline-flex;align-items:center;gap:5px;margin-top:2px}
  .chead .ti small::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .chead .cl{color:var(--muted);font-size:13px;cursor:pointer;padding:6px 8px}
  .cbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
  .cbody::-webkit-scrollbar{width:0}
  .msg{max-width:85%;padding:11px 14px;border-radius:17px;font-size:14.5px;line-height:1.5;white-space:pre-wrap}
  .msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;color:var(--ink)}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
  .msg .acts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .msg .acts button{background:var(--accent-soft);color:var(--accent);border:1px solid #d4e3da;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .typing{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;border-bottom-left-radius:5px;padding:14px 16px;display:flex;gap:5px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--pencil);animation:tb 1s infinite}
  .typing span:nth-child(2){animation-delay:.18s}.typing span:nth-child(3){animation-delay:.36s}
  @keyframes tb{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:9px 14px;border-top:1px solid var(--line);background:var(--surface)}
  .chips::-webkit-scrollbar{display:none}
  .chip2{white-space:nowrap;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 13px;font-size:12.5px;color:var(--ink);cursor:pointer;flex:none}
  .cin{display:flex;gap:9px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface);align-items:center}
  .cin input{flex:1;border:1px solid var(--line);border-radius:999px;padding:12px 16px;font-size:14.5px;outline:none;font-family:inherit}
  .cin input:focus{border-color:var(--accent)}
  .cin button{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;border:0;font-size:17px;cursor:pointer}
  @media print{.bar,.footer,.tabbar,#installmodal,#compass,#trackerpanel,#trackerintro{display:none}}
</style>
</head>

function load(){try{const r=JSON.parse(localStorage.getItem("pp_state"));const st=r&&r.branches?r:structuredClone(BLANK);if(!st.lang)st.lang="en";return heal(migrate(st));}catch(e){return structuredClone(BLANK);}}
/* a flow screen that needs a draft can never be shown without one */
function needsDraft(sc,st){st=st||S;const d=st.draft;
  if(sc==="recipe")return !(d&&(d.photoData||d.photoName));
  if(sc==="review")return !(d&&d.recipe&&Array.isArray(d.lines));
  if(sc==="result")return !(st.records&&st.records.length);
  if(/^tb[1-4]$/.test(sc))return !(st.tb&&Array.isArray(st.tb.cols));
  if(sc==="recview")return !(st.records&&st.records.some(r=>r.id===st.viewRec));
  if(sc==="review"&&st.draft&&typeof st.draft.recipe==="string"&&st.draft.recipe.indexOf("tpl:")===0)return !(st.templates||[]).some(x=>"tpl:"+x.id===st.draft.recipe);
  return false;}
/* any saved data, from any older version, is upgraded in place: missing pieces get defaults, nothing is thrown away */
function migrate(st){const B=structuredClone(BLANK);for(const k in B){if(st[k]===undefined)st[k]=B[k];}
  if(!Array.isArray(st.hist))st.hist=[];if(!Array.isArray(st.records))st.records=[];if(!Array.isArray(st.templates))st.templates=[];
  if(!Array.isArray(st.branches)||!st.branches.length)st.branches=B.branches;
  if(!st.branches.find(b=>b.id===st.branch))st.branch=st.branches[0].id;
  st.records=st.records.filter(r=>r&&typeof r==='object').map(r=>({...r,id:r.id||('r'+Math.random().toString(36).slice(2)),total:+r.total||0,collected:+r.collected||0,owed:+r.owed||0}));
  st.v=2;return st;}
function heal(st){if(needsDraft(st.screen,st)){st.screen="home";st.hist=[];}return st;}
function save(){
  try{localStorage.setItem("pp_state",JSON.stringify(S));return;}catch(e){}
  /* storage full: drop stored photos of old records (oldest first), keep the numbers */
  for(let i=S.records.length-1;i>=0;i--){if(S.records[i].photo){S.records[i].photo=null;try{localStorage.setItem("pp_state",JSON.stringify(S));return;}catch(e){}}}
  try{const keep=S.draft&&S.draft.photoData;if(S.draft)S.draft.photoData=null;localStorage.setItem("pp_state",JSON.stringify(S));if(S.draft)S.draft.photoData=keep;}catch(e){}
}

function bf(r){return Math.trunc(((+r.L||0)*(+r.W||0)*(+r.H||0))/12);}
function draftTotals(){
  const d=S.draft;if(!d)return{total:0,collected:0,owed:0,bfeet:0};
  const tp=draftTpl();if(tp){const c=computeTpl(tp,d.lines,d.pageTotal);return{total:c.total,collected:c.collected,owed:c.owed,bfeet:c.bfeet};}
  if(d.recipe==="timber"){let feet=d.lines.reduce((s,r)=>s+bf(r),0)+(d.extraBf||0);const rate=d.mvule?RATE_MVULE:RATE_TIMBER;return{bfeet:feet,total:feet*rate,collected:0,owed:0};}
  let total=0,collected=0,owed=0;d.lines.forEach(l=>{const a=+l.amount||0;total+=a;if(l.kind==="pencil")owed+=a;else collected+=a;});
  return{total,collected,owed,bfeet:0};
}

function parsePage(text,recipe){const out=[];

    if(recipe==="timber"){const re=/(\d{1,2})\s*[x×X*]\s*(\d{1,2})\s*[x×X*]\s*(\d{1,2})/g;let m;while((m=re.exec(ln)))out.push({label:m[1]+'x'+m[2]+'x'+m[3],L:+m[1],W:+m[2],H:+m[3]});return;}

/* =====================================================================
   MY BOOKS (templates): the owner describes their page, tests it, confirms.
   Polaris then reads every photo through that description.
   ===================================================================== */
const COLS={
  item:{en:"Item",sw:"Bidhaa",kind:"text"},
  qty:{en:"Quantity",sw:"Idadi",kind:"num"},
  price:{en:"Price each (@)",sw:"Bei kwa moja (@)",kind:"num"},
  amount:{en:"Amount",sw:"Kiasi",kind:"num"},
  pay:{en:"Payment type",sw:"Aina ya malipo",kind:"pay"},
  who:{en:"Customer",sw:"Mteja",kind:"text"},
  size:{en:"Timber size (4x2x12)",sw:"Saizi ya mbao (4x2x12)",kind:"size"}
};
const COL_ORDER=["item","qty","price","amount","pay","who","size"];
const MONTHS=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
function colName(k){const c=COLS[k];return c?(c[S.lang]||c.en):k;}
function tplById(id){return (S.templates||[]).find(x=>x.id===id);}
function draftTpl(){const d=S.draft;return d&&typeof d.recipe==="string"&&d.recipe.indexOf("tpl:")===0?tplById(d.recipe.slice(4)):null;}
function tplMath(tp){if(tp.cols.includes("size"))return "timber";if(tp.cols.includes("qty")&&tp.cols.includes("price"))return "qtyprice";return "amount";}

/* ---- the arithmetic: one place, used by test, review, result and share ---- */
function lineValue(tp,l){const m=tplMath(tp);
  if(m==="timber"){const pcs=tp.cols.includes("qty")?(+l.qty||1):1;const feet=Math.trunc(((+l.L||0)*(+l.W||0)*(+l.H||0))/12)*pcs;return{bf:feet,val:feet*(+tp.rate||RATE_TIMBER)};}
  if(m==="qtyprice"){const calc=(+l.qty||0)*(+l.price||0);
    if(tp.cols.includes("amount")&&(+l.amount)){return{val:+l.amount,clash:calc&&Math.abs(calc-(+l.amount))>0.5?calc:0};}
    return{val:calc};}
  return{val:+l.amount||0};}
function payOf(tp,name){return (tp.pays||[]).find(p=>p.name.toLowerCase()===String(name||"").toLowerCase());}
function computeTpl(tp,lines,pageTotal){const r={total:0,bfeet:0,byPay:{},owed:0,collected:0,owedList:[],count:0,unknownPay:0,clashes:0};
  (tp.pays||[]).forEach(p=>r.byPay[p.name]=0);
  (lines||[]).forEach(l=>{const v=lineValue(tp,l);if(!v.val&&!v.bf)return;r.count++;r.total+=v.val;r.bfeet+=v.bf||0;if(v.clash)r.clashes++;
    if(tp.cols.includes("pay")){const p=payOf(tp,l.pay);
      if(p){r.byPay[p.name]+=v.val;if(p.owed){r.owed+=v.val;r.owedList.push({name:l.who||l.item||"—",amt:v.val});}else r.collected+=v.val;}
      else{r.unknownPay+=v.val;r.byPay["?"]=(r.byPay["?"]||0)+v.val;}}
    else r.collected+=v.val;});
  r.pageTotal=+pageTotal||0;r.gap=r.pageTotal?Math.round(r.pageTotal-r.total):0;
  return r;}

/* ---- reading a written line through the template ---- */
const UNIT=/^(\d[\d,]*(?:\.\d+)?)(kgs?|kg|g|gms?|l|ltrs?|litres?|pcs?|pkts?|x)?\.?$/i;
function normWord(w){return String(w).toLowerCase().replace(/[^a-z]/g,"");}
function matchPay(tp,word){const w=normWord(word);if(w.length<3)return null;
  return (tp.pays||[]).find(p=>{const n=normWord(p.name);return n===w||(n.length>=4&&w.length>=4&&(n.indexOf(w)===0||w.indexOf(n)===0));})||null;}
function splitLine(tp,raw){const out={text:[],nums:[],pay:null,sizes:[]};
  let s=String(raw).replace(/[|_~]/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/^\d{1,2}\s*[\.\)]\s+/,""); /* "1. Rice" -> line number dropped */
  const re=/(\d{1,2})\s*[x×X*]\s*(\d{1,2})\s*[x×X*]\s*(\d{1,2})/g;let m;
  while((m=re.exec(s))){out.sizes.push({size:m[1]+"x"+m[2]+"x"+m[3],L:+m[1],W:+m[2],H:+m[3]});}
  if(out.sizes.length)return out;
  s.split(" ").forEach(tok=>{const t2=tok.replace(/^[@=:]+|[=:,;]+$/g,"");if(!t2)return;
    const p=matchPay(tp,t2);if(p&&!out.pay){out.pay=p.name;return;}
    const u=t2.match(UNIT);if(u){out.nums.push(parseFloat(u[1].replace(/,/g,"")));return;}
    if(/^(kgs?|kg|g|gms?|l|ltrs?|litres?|pcs?|pkts?|pieces?|bags?|units?)\.?$/i.test(t2))return; /* "3 Kgs": unit on its own */
    if(/[a-z]/i.test(t2))out.text.push(t2);});
  return out;}
function fillLine(tp,part){const l={};const numCols=tp.cols.filter(k=>COLS[k].kind==="num");
  l.item=part.text.join(" ");
  if(tp.cols.includes("who")&&!tp.cols.includes("item")){l.who=l.item;l.item="";}
  const nums=part.nums.slice();
  if(nums.length<numCols.length){l._unsure=true;
    if(tp.cols.includes("amount")&&nums.length===1){l.amount=nums[0];}
    else numCols.forEach((k,i)=>{if(nums[i]!=null)l[k]=nums[i];});}
  else{numCols.forEach((k,i)=>{l[k]=nums[i];});if(nums.length>numCols.length)l._unsure=true;}
  if(tp.cols.includes("pay"))l.pay=part.pay||"";
  return l;}
/* turn a whole page of text into lines, merging an item written on its own line with its numbers */
function parseTpl(tp,text,confs){const res={lines:[],pageTotal:0};let ended=false,pendingText=null;
  const rows=String(text||"").split(/\n+/);
  rows.forEach((raw,ri)=>{if(ended)return;const ln=raw.trim();if(!ln)return;
    const low=ln.toLowerCase();
    if(/\b(total|jumla)\b/.test(low)){const ns=(ln.match(/\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,""));if(ns.length)res.pageTotal=Math.max(...ns);ended=true;return;}
    if(MONTHS.test(low)||/\b(quantity|payment|idadi|malipo)\b/.test(low))return;
    const part=splitLine(tp,ln);const unsure=confs&&confs[ri]!=null&&confs[ri]<70;
    if(part.sizes.length){part.sizes.forEach(z=>res.lines.push(Object.assign({},z,{_unsure:unsure})));return;}
    if(tplMath(tp)==="timber")return;
    const hasNum=part.nums.length>0,hasText=part.text.length>0;
    if(!hasNum&&hasText){const last=res.lines[res.lines.length-1];
      if(last&&!last.item&&!last.who){last.item=part.text.join(" ");}else pendingText=part.text;return;}
    if(!hasNum)return;
    if(!hasText&&pendingText){part.text=pendingText;pendingText=null;}
    const l=fillLine(tp,part);if(unsure)l._unsure=true;res.lines.push(l);});
  return res;}

function blankTplLine(tp){const l={};tp.cols.forEach(k=>{if(k==="size"){l.size="";l.L="";l.W="";l.H="";}else l[k]="";});return l;}
function setTL(i,k,v){const tp=draftTpl(),l=S.draft.lines[i];if(!tp||!l)return;
  if(k==="size"){l.size=v;const m=v.match(/(\d+)\s*[x×X*]\s*(\d+)\s*[x×X*]\s*(\d+)/);if(m){l.L=+m[1];l.W=+m[2];l.H=+m[3];}else{l.L=l.W=l.H="";}}
  else l[k]=COLS[k]&&COLS[k].kind==="num"?num(v):v;
  delete l._unsure;save();tplLive(i);}
function tplLive(i){const tp=draftTpl();const d=S.draft;const c=computeTpl(tp,d.lines,d.pageTotal);
  if(i!=null){const v=lineValue(tp,d.lines[i]);const el=document.getElementById('lv'+i);if(el)el.textContent=tplMath(tp)==="timber"?`${v.bf} bf · ${money(v.val)}`:money(v.val);}

  const ck=document.getElementById('pagecheck');if(ck)ck.innerHTML=pageCheckText(c);}
function pageCheckText(c){if(!c.pageTotal)return '';return c.gap?`⚠ ${t('gapMsg').replace('{p}',money(c.pageTotal)).replace('{s}',money(c.total)).replace('{g}',money(Math.abs(c.gap)))}`:`✓ ${t('matchMsg').replace('{p}',money(c.pageTotal))}`;}
function cyclePay(i){const tp=draftTpl(),l=S.draft.lines[i];const names=tp.pays.map(p=>p.name);const j=names.findIndex(n=>n.toLowerCase()===String(l.pay||"").toLowerCase());l.pay=names[(j+1)%names.length]||"";delete l._unsure;save();render();}
function delTL(i){S.draft.lines.splice(i,1);if(!S.draft.lines.length)S.draft.lines.push(blankTplLine(draftTpl()));save();render();}
function addTL(){S.draft.lines.push(blankTplLine(draftTpl()));save();render();}

  a:{en:"Use Polaris every day and your recorded sales become proof. That proof builds a credit picture that can unlock stock financing — and in a Polaris community, shops pool and source funds together, chama-style. No record, no proof, no funds. Step one: start recording.",sw:"Tumia Polaris kila siku na mauzo yako yanakuwa uthibitisho. Uthibitisho huo unajenga hali ya mkopo inayoweza kufungua ufadhili wa bidhaa — na kwenye jamii ya Polaris, maduka yanachangia pamoja kama chama. Hatua ya kwanza: anza kurekodi."},act:[{t:{en:'Start recording',sw:'Anza'},go:'capture'}]},
 {id:'branch',k:['branch','tawi','matawi','merge','unganisha'],
  a:{en:"More than one shop? Each branch records its own page, and as owner you see them merged — every branch and the total. Add branches in More → Branches. Merging is a Pro feature.",sw:"Una duka zaidi ya moja? Kila tawi linarekodi ukurasa wake, na wewe mmiliki unaona yameunganishwa — kila tawi na jumla. Ongeza matawi kwenye Zaidi → Matawi. Kuunganisha ni kipengele cha Pro."},act:[{t:{en:'Records',sw:'Rekodi'},go:'records'}]},
 {id:'lang',k:['swahili','kiswahili','language','lugha','english','kiingereza'],
  a:{en:"Yes — tap the ENG / SWA switch at the top right and the whole app flips between English and Kiswahili, me included.",sw:"Ndiyo — gonga kitufe cha ENG / SWA kulia juu na app yote inabadilika kati ya Kiingereza na Kiswahili, pamoja nami."}},
 {id:'contact',k:['contact','community','join','whatsapp','human','talk','person','mtu','jamii'],
  a:{en:"Want a human, or other shops? Join the Polaris WhatsApp community, or message us directly — someone’s always there.",sw:"Unataka mtu, au maduka mengine? Jiunge na jamii ya Polaris ya WhatsApp, au tutumie ujumbe moja kwa moja — kuna mtu daima."},act:[{t:{en:'Join community',sw:'Jiunge'},link:'community'},{t:{en:'Message us',sw:'Tutumie'},link:'wa'}]}
];
var trkMsgs=[];
function kbAnswer(q){q=(q||'').toLowerCase();for(var i=0;i<KB.length;i++){for(var j=0;j<KB[i].k.length;j++){if(q.indexOf(KB[i].k[j])>-1)return KB[i];}}return null;}
function closeTracker(){var p=document.getElementById('trackerpanel');if(p)p.style.display='none';}
function silenceCompass(){S.trackerOff=true;save();closeTracker();refreshCompass();}
function openTracker(){
  var p=document.getElementById('trackerpanel'),sh=document.getElementById('tsheet');if(!p||!sh)return;var sw=(S.lang==='sw');
  sh.innerHTML='<div class="chead"><div class="av">🧭</div><div class="ti"><b>'+t('trkTitle')+'</b><small>'+(sw?'Papo hapa':'Online, here to help')+'</small></div><span class="cl" onclick="silenceCompass()" title="Silence">🔕</span><span class="cl" onclick="closeTracker()">'+t('trkClose')+'</span></div>'
    +'<div class="cbody" id="cbody"></div><div class="chips" id="cchips"></div>'
    +'<div class="cin"><input id="cinput" placeholder="'+(sw?'Niulize chochote…':'Ask me anything…')+'" onkeydown="if(event.key===\'Enter\')trkAsk()"><button onclick="trkAsk()">➤</button></div>';
  trkMsgs=[{who:'bot',text:(sw?'Mimi ni dira yako 🧭 — niulize chochote kuhusu Polaris, au gonga swali hapa chini.':'I’m your compass 🧭 — ask me anything about Polaris, or tap a question below.')}];
  renderChat();renderChips();p.style.display='flex';
  setTimeout(function(){var ci=document.getElementById('cinput');if(ci)ci.focus();},200);
}
function renderChips(){var c=document.getElementById('cchips');if(!c)return;var sw=(S.lang==='sw');
  var qs=sw?['Jinsi ya kuandika mauzo?','Malipo yanafanyaje?','Kwa nini kusubiri uthibitisho?','Viwanda ni nini?','Sakinisha app']:['How do I record a sale?','How do payments work?','Why wait for confirmation?','What is Viwanda?','Install the app'];
  c.innerHTML=qs.map(function(x){return '<button class="chip2" onclick="trkChip(this)">'+x+'</button>';}).join('');}
function trkChip(b){var ci=document.getElementById('cinput');if(ci){ci.value=b.textContent;trkAsk();}}
function renderChat(){var b=document.getElementById('cbody');if(!b)return;
  b.innerHTML=trkMsgs.map(function(m){if(m.typing)return '<div class="typing"><span></span><span></span><span></span></div>';var acts=m.acts?('<div class="acts">'+m.acts+'</div>'):'';return '<div class="msg '+(m.who==='me'?'me':'bot')+'">'+m.text+acts+'</div>';}).join('');
  b.scrollTop=b.scrollHeight;}
function trkAsk(){
  var ci=document.getElementById('cinput');if(!ci)return;var q=(ci.value||'').trim();if(!q)return;ci.value='';
  trkMsgs.push({who:'me',text:q});trkMsgs.push({typing:true});renderChat();
  setTimeout(function(){
    for(var i=trkMsgs.length-1;i>=0;i--){if(trkMsgs[i].typing){trkMsgs.splice(i,1);break;}}
    var sw=(S.lang==='sw'),hit=kbAnswer(q);
    if(hit){var acts='';if(hit.act){acts=hit.act.map(function(a){var label=a.t?(sw?a.t.sw:a.t.en):(sw?'Fungua':'Open');if(a.go)return '<button onclick="trkDo(\'go\',\''+a.go+'\')">'+label+'</button>';if(a.link)return '<button onclick="trkDo(\'link\',\''+a.link+'\')">'+label+'</button>';return '';}).join('');}
      trkMsgs.push({who:'bot',text:(sw?hit.a.sw:hit.a.en),acts:acts});}
    else{try{rpc('tracker_note',{p_app:'polaris-pro',p_screen:S.screen,p_kind:'question',p_body:q,p_phone:S.proPhone||null}).catch(function(){});}catch(e){}
      trkMsgs.push({who:'bot',text:(sw?'Hilo sijalijua bado — nimelipeleka kwa timu ili niongezwe. Wakati huo huo:':'I don’t know that one yet — I’ve sent it to the team so I can learn it. Meanwhile:'),acts:'<button onclick="trkDo(\'link\',\'community\')">'+(sw?'Jiunge na jamii':'Join community')+'</button><button onclick="trkDo(\'link\',\'wa\')">'+(sw?'Tutumie':'Message us')+'</button>'});}
    renderChat();
  },480);
}
function trkDo(kind,val){var tops=['home','records','explore','pro','more'];
  if(kind==='go'){closeTracker();if(tops.indexOf(val)>-1)goTab(val);else go(val);}
  else if(kind==='link'){var map={viwanda:CFG.viwandaUrl,polaris:CFG.polarisFreeUrl,community:COMMUNITY,wa:WA};openLink(map[val]||val);}}
function showTrackerIntro(){
  if(S.seenTracker||!compassEligible())return;
  var m=document.getElementById('trackerintro');if(!m)return;
  document.getElementById('ti-title').textContent=t('trkIntroTitle');
  document.getElementById('ti-sub').textContent=t('trkIntroSub');
  var ok=document.getElementById('ti-ok');ok.textContent=t('gotIt');
  ok.onclick=function(){S.seenTracker=true;save();m.style.display='none';refreshCompass();};
  m.style.display='flex';
}

function render(){
  const flow={capture:screen_capture,recipe:screen_recipe,review:screen_review,result:screen_result,branches:screen_branches,privacy:screen_privacy,share:screen_share,safe:screen_safe,tb1:screen_tb1,tb2:screen_tb2,tb3:screen_tb3,tb4:screen_tb4,recview:screen_recview};
  const top={home:page_home,records:page_records,explore:page_explore,pro:page_pro,more:page_more};
  let html;
  try{
    if(needsDraft(S.screen)){S.screen="home";S.hist=[];save();}
    if(TOP.includes(S.screen)){html=topbar("Polaris Pro",{noback:true})+top[S.screen]()+tabbar();}
    else{html=(flow[S.screen]||page_home)();}
  }catch(err){console.error(err);S.screen="home";S.hist=[];S.draft=null;S.recipeChoice=null;if(S.tour)S.tour.active=false;save();
    html=topbar("Polaris Pro",{noback:true})+page_home()+tabbar();}
  let ov='';try{ov=tourOverlay();}catch(err){if(S.tour)S.tour.active=false;save();}
  document.getElementById("app").innerHTML=html+ov;window.scrollTo(0,0);
  try{refreshCompass();}catch(err){}
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw%20(1).js').catch(function(){});});}

/* ---- install nudge (keeps popping until installed) ---- */
var deferredPrompt=null;
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installEligible(){return !isStandalone() && !localStorage.getItem('pp_installed') && !(S.tour&&S.tour.active);}
function showInstallModal(){
  if(!installEligible())return;
  var m=document.getElementById('installmodal');if(!m)return;
  var sw=(S.lang==='sw');
  document.getElementById('im-title').textContent=sw?'Sakinisha Polaris Pro':'Install Polaris Pro';
  document.getElementById('im-sub').textContent=sw?'Iweke kwenye skrini yako kama programu — inafunguka haraka, hata bila mtandao.':'Add it to your home screen like an app — opens fast, even offline.';
  var ib=document.getElementById('im-install');ib.textContent=sw?'Sakinisha sasa':'Install now';ib.onclick=installClick;
  var lb=document.getElementById('im-later');lb.textContent=sw?'Baadaye':'Not now';lb.onclick=function(){m.style.display='none';};
  m.style.display='flex';
}
function hideInstallModal(){var m=document.getElementById('installmodal');if(m)m.style.display='none';}
function installClick(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(c){if(c&&c.outcome==='accepted'){localStorage.setItem('pp_installed','1');hideInstallModal();}deferredPrompt=null;});}
  else{alert((S.lang==='sw')?'Fungua kwenye Chrome → menyu (⋮) → Sakinisha programu / Ongeza kwenye skrini':'Open in Chrome → menu (⋮) → Install app / Add to Home screen');}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;localStorage.removeItem('pp_installed');showInstallModal();});
/* two windows open (browser tab + installed app): keep them in step instead of one overwriting the other */
window.addEventListener('storage',function(e){if(e.key!=='pp_state'||!e.newValue)return;try{const keepScreen=S.screen,keepHist=S.hist,keepDraft=S.draft;S=migrate(JSON.parse(e.newValue));S.screen=keepScreen;S.hist=keepHist;S.draft=keepDraft;if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();}catch(x){}});
askPersist();
window.addEventListener('appinstalled',function(){localStorage.setItem('pp_installed','1');deferredPrompt=null;hideInstallModal();});
setTimeout(function(){var m=document.getElementById('installmodal');if(installEligible()&&m&&m.style.display!=='flex')showInstallModal();},3500);
if(S.proPhone){checkPro(true);}
if(S.bookedAI&&S.bookedSent===false){rpc('tracker_note',{p_app:'polaris-pro',p_screen:'pro',p_kind:'booking',p_body:'AI handwriting reading: booked',p_phone:S.bookedAI}).then(function(){S.bookedSent=true;save();}).catch(function(){});}
refreshCompass();
try{rpc('tracker_enabled',{p_app:'polaris-pro'}).then(function(v){trackerEnabled=(v!==false);refreshCompass();}).catch(function(){});}catch(e){}
setTimeout(function(){var im=document.getElementById('installmodal');if(im&&im.style.display!=='flex')showTrackerIntro();},1400);
</script>
