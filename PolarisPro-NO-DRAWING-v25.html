const RECIPES={sales:{icon:"Σ"},paidowed:{icon:"✎"},timber:{icon:"▤"},teach:{icon:"✦"}};
const BLANK={screen:"home",hist:[],lang:"en",pro:false,paidThrough:null,
  branches:[{id:"b1",name:"Main shop"}],branch:"b1",records:[],draft:null,recipeChoice:null,teachText:"",templates:[],tb:null};
let S=load();
const TOP=["home","records","explore","pro","more"];

function load(){try{const r=JSON.parse(localStorage.getItem("pp_state"));const st=r&&r.branches?r:structuredClone(BLANK);if(!st.lang)st.lang="en";return heal(migrate(st));}catch(e){return structuredClone(BLANK);}}
/* a flow screen that needs a draft can never be shown without one */
function needsDraft(sc,st){st=st||S;const d=st.draft;
  if(sc==="recipe")return !(d&&(d.photoData||d.photoName));
  if(sc==="review")return !(d&&d.recipe&&Array.isArray(d.lines));
  if(sc==="result")return !(st.records&&st.records.length);
  if(/^tb[1-4]$/.test(sc))return !(st.tb&&Array.isArray(st.tb.cols));
  if(sc==="recview")return !(st.records&&st.records.some(r=>r.id===st.viewRec));
  if(sc==="review"&&st.draft&&typeof st.draft.recipe==="string"&&st.draft.recipe.indexOf("tpl:")===0)return !(st.templates||[]).some(x=>"tpl:"+x.id===st.draft.recipe);
  return false;}
/* any saved data, from any older version, is upgraded in place: missing pieces get defaults, nothing is thrown away */
function migrate(st){const B=structuredClone(BLANK);for(const k in B){if(st[k]===undefined)st[k]=B[k];}
  if(!Array.isArray(st.hist))st.hist=[];if(!Array.isArray(st.records))st.records=[];if(!Array.isArray(st.templates))st.templates=[];
  if(!Array.isArray(st.branches)||!st.branches.length)st.branches=B.branches;
  if(!st.branches.find(b=>b.id===st.branch))st.branch=st.branches[0].id;
  st.records=st.records.filter(r=>r&&typeof r==='object').map(r=>({...r,id:r.id||('r'+Math.random().toString(36).slice(2)),total:+r.total||0,collected:+r.collected||0,owed:+r.owed||0}));
  st.v=2;return st;}
function heal(st){if(needsDraft(st.screen,st)){st.screen="home";st.hist=[];}return st;}
function save(){
  try{localStorage.setItem("pp_state",JSON.stringify(S));return;}catch(e){}
  /* storage full: drop stored photos of old records (oldest first), keep the numbers */
  for(let i=S.records.length-1;i>=0;i--){if(S.records[i].photo){S.records[i].photo=null;try{localStorage.setItem("pp_state",JSON.stringify(S));return;}catch(e){}}}
  try{const keep=S.draft&&S.draft.photoData;if(S.draft)S.draft.photoData=null;localStorage.setItem("pp_state",JSON.stringify(S));if(S.draft)S.draft.photoData=keep;}catch(e){}
}
function t(k){const o=L[k];if(o==null)return k;return o[S.lang]||o.en;}
function toggleLang(){S.lang=S.lang==="sw"?"en":"sw";save();render();}
function go(sc){S.hist.push(S.screen);S.screen=sc;save();render();}
function goTab(id){S.screen=id;S.hist=[];save();render();}
function back(){let sc=S.hist.pop()||"home";while(needsDraft(sc)||(S.screen==="result"&&(sc==="review"||sc==="recipe"||sc==="capture"))||(/^tb/.test(sc)&&!S.tb))sc=S.hist.pop()||"home";S.screen=sc;save();render();}
function reset(){if(confirm(t("resetConfirm"))){const keep={lang:S.lang,proPhone:S.proPhone,pro:S.pro,paidThrough:S.paidThrough,proTier:S.proTier,seenTracker:S.seenTracker};S=Object.assign(structuredClone(BLANK),keep);save();render();}}
function money(n){return "KES "+Math.round(n||0).toLocaleString();}
function todayStr(){return new Date().toLocaleDateString("en-GB",{day:"2-digit",month:"short"});}
function daysLeft(){if(!S.paidThrough)return 0;return Math.ceil((new Date(S.paidThrough)-new Date())/86400000);}
function isLive(){return S.pro&&daysLeft()>0;}
/* Jan–Mar launch: every working feature is free so the network spreads. Money comes after the network. */
const LAUNCH_FREE_UNTIL=new Date("2027-04-01T00:00:00+03:00");
function launchFree(){return new Date()<LAUNCH_FREE_UNTIL;}
function unlocked(){return isLive()||launchFree();}
async function bookAI(){const el=document.getElementById("bphone");const phone=(el&&el.value||"").replace(/\s/g,"").trim();
  if(!/^(?:\+?254|0)(7|1)\d{8}$/.test(phone)){alert(t('phoneAlert'));return;}
  S.bookedAI=phone;save();
  try{await rpc('tracker_note',{p_app:'polaris-pro',p_screen:'pro',p_kind:'booking',p_body:'AI handwriting reading: booked',p_phone:phone});S.bookedSent=true;save();alert(t('bookedOk'));}

function mergeBackup(d){let added=0;const have=new Set(S.records.map(r=>r.id));

let OCR_LIB=null;
function loadOcr(){if(window.Tesseract)return Promise.resolve(window.Tesseract);if(OCR_LIB)return OCR_LIB;
  OCR_LIB=new Promise((ok,no)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';sc.onload=()=>ok(window.Tesseract);sc.onerror=()=>{OCR_LIB=null;no(new Error('net'));};document.head.appendChild(sc);});return OCR_LIB;}
function ocrStatus(txt){const el=document.getElementById('ocrstat');if(el)el.innerHTML=txt;}
function readPage(){const d=S.draft;if(!d||!d.photoData)return;d.ocr="reading";save();
  if(S.screen==="review")render();
  loadOcr().then(T=>cleanForOcr(d.photoData).then(img=>T.recognize(img,'eng',{logger:m=>{if(m.status==='recognizing text')ocrStatus(t('reading')+' '+Math.round(m.progress*100)+'%');}})))
  .then(res=>{if(S.draft!==d)return;const tp=draftTpl();
     const rows=(res.data.lines&&res.data.lines.length)?res.data.lines:null;
     const text=rows?rows.map(x=>x.text.trim()).join("\n"):res.data.text;const confs=rows?rows.map(x=>x.confidence):null;
     const H=window._ocrH||0;d.ocrRows=(rows&&H)?rows.map(x=>({t:x.text.trim(),c:Math.round(x.confidence),y0:x.bbox.y0/H,y1:x.bbox.y1/H})):null;
     let lines;
     if(tp){const pr=parseTpl(tp,text,confs);lines=pr.lines;if(pr.pageTotal)d.pageTotal=pr.pageTotal;}
     else{lines=parsePage(text,d.recipe);const tm=String(text).match(/\b(?:total|jumla)\b[^\d]*(\d[\d,]*)/i);if(tm)d.pageTotal=+tm[1].replace(/,/g,"");}
     /* a bookkeeper must not guess: if most of what was read is uncertain, fill nothing and say so */
     const avg=confs&&confs.length?confs.reduce((x,y)=>x+y,0)/confs.length:100;
     const unsure=lines.filter(l=>l._unsure).length;
     if(lines.length&&(avg<55||unsure>lines.length/2)){lines=[];d.pageTotal=0;}
     if(lines.length){d.lines=lines;d.ocr="done";}else{d.ocr="none";if(!d.lines.some(l=>l._img))d.tapMode=true;}save();if(S.screen==="review")render();})

/* turn the text Polaris read into lines: "Unga 2kg 540" -> {label:"Unga 2kg", amount:540} */
function parsePage(text,recipe){const out=[];
  (text||"").split(/\n+/).forEach(raw=>{const ln=raw.replace(/[|_~]/g,' ').replace(/\s+/g,' ').trim();if(!ln)return;
    if(recipe==="timber"){const re=/(\d{1,2})\s*[x×X*]\s*(\d{1,2})\s*[x×X*]\s*(\d{1,2})/g;let m;while((m=re.exec(ln)))out.push({label:m[1]+'x'+m[2]+'x'+m[3],L:+m[1],W:+m[2],H:+m[3]});return;}
    if(/\b(total|jumla|tot)\b/i.test(ln))return; /* don't count the page's own total twice */
    const nums=ln.match(/\d[\d,\.]*/g);if(!nums)return;
    const last=nums[nums.length-1];const amt=Math.round(parseFloat(last.replace(/,/g,'').replace(/\.(?=\d{3}\b)/g,'')));
    if(!amt||amt<1||amt>10000000)return;
    const label=ln.slice(0,ln.lastIndexOf(last)).replace(/[=:\-–.]+\s*$/,'').trim();
    out.push({label:label||('Line '+(out.length+1)),amount:amt,kind:"pen"});});
  return out.slice(0,200);}
/* make handwriting stand out: grey, boost contrast, wash out the faint grid lines of exercise books */
function cleanForOcr(src){return new Promise(ok=>{const im=new Image();im.onload=()=>{try{
  const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);
  const D=g.getImageData(0,0,c.width,c.height),a=D.data;let sum=0;const n=a.length/4;
  for(let i=0;i<a.length;i+=4){const l=0.3*a[i]+0.59*a[i+1]+0.11*a[i+2];a[i]=l;sum+=l;}
  const mean=sum/n,thr=mean*0.78;
  for(let i=0;i<a.length;i+=4){const v=a[i]<thr?0:255;a[i]=a[i+1]=a[i+2]=v;}
  g.putImageData(D,0,0);window._ocrH=c.height;ok(c.toDataURL('image/png'));}catch(e){window._ocrH=0;ok(src);}};im.onerror=()=>ok(src);im.src=src;});}

/* =====================================================================
   MY BOOKS (templates): the owner describes their page, tests it, confirms.
   Columns can be ready-made or their own ("Other"); the maths can be
   Polaris's rule or their own calculation built from tap-chips.
   ===================================================================== */
const COLS={
  item:{en:"Item",sw:"Bidhaa",kind:"text"},
  qty:{en:"Quantity",sw:"Idadi",kind:"num"},
  price:{en:"Price each (@)",sw:"Bei kwa moja (@)",kind:"num"},
  amount:{en:"Amount",sw:"Kiasi",kind:"num"},
  pay:{en:"Payment type",sw:"Aina ya malipo",kind:"pay"},
  who:{en:"Customer",sw:"Mteja",kind:"text"},
  size:{en:"Timber size (4x2x12)",sw:"Saizi ya mbao (4x2x12)",kind:"size"}
};
const COL_ORDER=["item","qty","price","amount","pay","who","size"];
const SHORT={item:{en:"Item",sw:"Bidhaa"},qty:{en:"Qty",sw:"Idadi"},price:{en:"@",sw:"@"},amount:{en:"Amt",sw:"Kiasi"},pay:{en:"Paid by",sw:"Malipo"},who:{en:"Customer",sw:"Mteja"},size:{en:"Size",sw:"Saizi"}};
const MONTHS=/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\b/i;
function colDef(k,tp){if(COLS[k])return{name:COLS[k][S.lang]||COLS[k].en,kind:COLS[k].kind};const c=tp&&tp.custom&&tp.custom[k];return c?{name:c.name,kind:c.kind}:{name:k,kind:"text"};}
function colName(k,tp){return colDef(k,(tp&&typeof tp==="object")?tp:(S.tb||draftTpl&&draftTpl())).name;}
function colShort(k,tp){return SHORT[k]?(SHORT[k][S.lang]||SHORT[k].en):colDef(k,tp).name;}
function kindOf(tp,k){return colDef(k,tp).kind;}
function numCols(tp){return tp.cols.filter(k=>kindOf(tp,k)==="num");}
function textCols(tp){return tp.cols.filter(k=>kindOf(tp,k)==="text");}
function tplById(id){return (S.templates||[]).find(x=>x.id===id);}
function draftTpl(){const d=S.draft;return d&&typeof d.recipe==="string"&&d.recipe.indexOf("tpl:")===0?tplById(d.recipe.slice(4)):null;}
function tplMath(tp){if(tp.calc&&tp.calc.line&&tp.calc.line.length)return "custom";if(tp.cols.includes("size"))return "timber";if(tp.cols.includes("qty")&&tp.cols.includes("price"))return "qtyprice";return "amount";}

/* ---- the owner's own calculation: tokens tapped from chips, never free text, never eval ---- */
const OPS={"+":[1,(a,b)=>a+b],"-":[1,(a,b)=>a-b],"*":[2,(a,b)=>a*b],"/":[2,(a,b)=>b?a/b:0]};
function evalTok(tok,vars){const out=[],ops=[];
  const apply=()=>{const o=ops.pop();const b=out.pop()||0,a=out.pop()||0;out.push(OPS[o][1](a,b));};
  for(const x of tok||[]){
    if(x.n!=null)out.push(+x.n);
    else if(x.v!=null)out.push(+vars[x.v]||0);
    else if(x.s!=null)out.push(+vars["step:"+x.s]||0);
    else if(x.o==="(")ops.push("(");
    else if(x.o===")"){while(ops.length&&ops[ops.length-1]!=="(")apply();ops.pop();}
    else if(OPS[x.o]){while(ops.length&&OPS[ops[ops.length-1]]&&OPS[ops[ops.length-1]][0]>=OPS[x.o][0])apply();ops.push(x.o);}}
  while(ops.length){if(ops[ops.length-1]==="("){ops.pop();continue;}apply();}
  const r=out.length?out[out.length-1]:0;return isFinite(r)?r:0;}
function tokText(tp,tok){return (tok||[]).map(x=>x.n!=null?x.n:x.v!=null?colShort(x.v,tp):x.s!=null?x.s:({"*":"×","/":"÷","-":"−"}[x.o]||x.o)).join(" ")||"…";}

/* ---- the arithmetic: one place, used by test, review, result and share ---- */
function lineValue(tp,l){const m=tplMath(tp);
  if(m==="custom"){const vars={};numCols(tp).forEach(k=>vars[k]=+l[k]||0);const steps={};
    (tp.calc.steps||[]).forEach(st=>{let v=evalTok(st.tok,vars);if(st.floor)v=Math.trunc(v);v=Math.round(v*100)/100;vars["step:"+st.name]=v;steps[st.name]=v;});
    return{val:Math.round(evalTok(tp.calc.line,vars)*100)/100,steps};}
  if(m==="timber"){const pcs=tp.cols.includes("qty")?(+l.qty||1):1;const feet=Math.trunc(((+l.L||0)*(+l.W||0)*(+l.H||0))/12)*pcs;return{bf:feet,val:feet*(+tp.rate||RATE_TIMBER)};}
  if(m==="qtyprice"){const calc=(+l.qty||0)*(+l.price||0);
    if(tp.cols.includes("amount")&&(+l.amount)){return{val:+l.amount,clash:calc&&Math.abs(calc-(+l.amount))>0.5?calc:0};}
    return{val:calc};}
  return{val:+l.amount||0};}
function payOf(tp,name){return (tp.pays||[]).find(p=>p.name.toLowerCase()===String(name||"").toLowerCase());}
function computeTpl(tp,lines,pageTotal){const r={total:0,bfeet:0,byPay:{},owed:0,collected:0,owedList:[],count:0,unknownPay:0,clashes:0,stepTotals:{}};
  (tp.pays||[]).forEach(p=>r.byPay[p.name]=0);
  (lines||[]).forEach(l=>{const v=lineValue(tp,l);if(!v.val&&!v.bf)return;r.count++;r.total+=v.val;r.bfeet+=v.bf||0;if(v.clash)r.clashes++;
    if(v.steps)for(const k in v.steps)r.stepTotals[k]=(r.stepTotals[k]||0)+v.steps[k];
    if(tp.cols.includes("pay")){const p=payOf(tp,l.pay);
      if(p){r.byPay[p.name]+=v.val;if(p.owed){r.owed+=v.val;r.owedList.push({name:l.who||l.item||"—",amt:v.val});}else r.collected+=v.val;}
      else{r.unknownPay+=v.val;r.byPay["?"]=(r.byPay["?"]||0)+v.val;}}
    else r.collected+=v.val;});
  r.total=Math.round(r.total*100)/100;
  r.pageTotal=+pageTotal||0;r.gap=r.pageTotal?Math.round(r.pageTotal-r.total):0;
  return r;}

/* ---- reading a written line through the template (typed test lines, printed pages) ---- */
const UNIT=/^(\d[\d,]*(?:\.\d+)?)(kgs?|kg|g|gms?|l|ltrs?|litres?|pcs?|pkts?|x)?\.?$/i;
function normWord(w){return String(w).toLowerCase().replace(/[^a-z]/g,"");}
function matchPay(tp,word){const w=normWord(word);if(w.length<3)return null;
  return (tp.pays||[]).find(p=>{const n=normWord(p.name);return n===w||(n.length>=4&&w.length>=4&&(n.indexOf(w)===0||w.indexOf(n)===0));})||null;}
function splitLine(tp,raw){const out={text:[],nums:[],pay:null,sizes:[]};
  let s=String(raw).replace(/[|_~]/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/^\d{1,2}\s*[\.\)]\s+/,"");
  const re=/(\d{1,2})\s*[x×X*]\s*(\d{1,2})\s*[x×X*]\s*(\d{1,2})(\s*=\s*\d+)?/g;let m;
  while((m=re.exec(s))){out.sizes.push({size:m[1]+"x"+m[2]+"x"+m[3],L:+m[1],W:+m[2],H:+m[3]});}
  if(out.sizes.length&&tp.cols.includes("size"))return out;
  if(out.sizes.length)s=s.replace(re," ");
  s.split(" ").forEach(tok=>{const t2=tok.replace(/^[@=:]+|[=:,;]+$/g,"");if(!t2)return;
    const p=matchPay(tp,t2);if(p&&!out.pay){out.pay=p.name;return;}
    const u=t2.match(UNIT);if(u){out.nums.push(parseFloat(u[1].replace(/,/g,"")));return;}
    if(/^(kgs?|kg|g|gms?|l|ltrs?|litres?|pcs?|pkts?|pieces?|bags?|units?)\.?$/i.test(t2))return;
    if(/[a-z]/i.test(t2))out.text.push(t2);});
  return out;}
function fillLine(tp,part){const l={};const nc=numCols(tp),tc=textCols(tp);
  const words=part.text.join(" ");if(tc.length)l[tc[0]]=words;
  const nums=part.nums.slice();
  if(nums.length<nc.length){l._unsure=true;
    if(tp.cols.includes("amount")&&nums.length===1&&tplMath(tp)!=="custom"){l.amount=nums[0];}
    else nc.forEach((k,i)=>{if(nums[i]!=null)l[k]=nums[i];});}
  else{nc.forEach((k,i)=>{l[k]=nums[i];});if(nums.length>nc.length)l._unsure=true;}
  if(tp.cols.includes("pay"))l.pay=part.pay||"";
  return l;}
function parseTpl(tp,text,confs){const res={lines:[],pageTotal:0};let ended=false,pendingText=null;
  const rows=String(text||"").split(/\n+/);const hasSize=tp.cols.includes("size");
  rows.forEach((raw,ri)=>{if(ended)return;const ln=raw.trim();if(!ln)return;
    const low=ln.toLowerCase();
    if(/\b(total|jumla)\b/.test(low)){const ns=(ln.match(/\d[\d,]*/g)||[]).map(x=>+x.replace(/,/g,""));if(ns.length)res.pageTotal=Math.max(...ns);ended=true;return;}
    if(MONTHS.test(low)||/\b(quantity|payment|idadi|malipo)\b/.test(low))return;
    const part=splitLine(tp,ln);const unsure=confs&&confs[ri]!=null&&confs[ri]<70;
    if(part.sizes.length&&hasSize){part.sizes.forEach(z=>res.lines.push(Object.assign({},z,{_unsure:unsure})));return;}
    if(part.sizes.length){/* sizes written as 4x2x12 feed the owner's own L, W, H columns, one line per size */
      part.sizes.forEach(z=>{const l=fillLine(tp,{text:part.text,nums:[z.L,z.W,z.H].concat(part.nums),pay:part.pay});if(unsure)l._unsure=true;res.lines.push(l);});return;}
    if(hasSize)return;
    const hasNum=part.nums.length>0,hasText=part.text.length>0;
    if(!hasNum&&hasText){const last=res.lines[res.lines.length-1];const tc=textCols(tp)[0];
      if(last&&tc&&!last[tc]){last[tc]=part.text.join(" ");}else pendingText=part.text;return;}
    if(!hasNum)return;
    if(!hasText&&pendingText){part.text=pendingText;pendingText=null;}
    const l=fillLine(tp,part);if(unsure)l._unsure=true;res.lines.push(l);});
  return res;}

/* =====================================================================
   COPY SHEET: the camera is the proof. Rows come from the owner's taps
   (or "find rows for me"), columns from lines the owner sets once per book.
   Each row is cut into cells, each cell's picture above its own box.
   Nothing is ever guessed silently; the owner can fix everything.
   ===================================================================== */
function zoomImg(src){const o=document.createElement('div');o.className='zoom';o.innerHTML=`<img src="${src}"><p>${t('tapClose')}</p>`;o.onclick=()=>o.remove();document.body.appendChild(o);}
function loadImg(src){return new Promise(ok=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>ok(null);im.src=src;});}
async function cropRegion(src,x0,y0,x1,y1,maxW,fade){const im=await loadImg(src);if(!im)return null;
  const sx=Math.round(x0*im.width),sy=Math.round(y0*im.height),sw=Math.max(8,Math.round((x1-x0)*im.width)),sh=Math.max(8,Math.round((y1-y0)*im.height));
  const W=Math.min(maxW,sw),sc=W/sw;const c=document.createElement('canvas');c.width=W;c.height=Math.max(8,Math.round(sh*sc));
  const g=c.getContext('2d');g.drawImage(im,sx,sy,sw,sh,0,0,W,c.height);
  if(fade){const fh=Math.round(c.height*0.26);g.fillStyle='rgba(255,255,255,0.62)';g.fillRect(0,0,W,fh);g.fillRect(0,c.height-fh,W,fh);g.fillStyle='#e0742b';g.fillRect(0,fh,5,c.height-2*fh);}
  return c.toDataURL('image/jpeg',0.68);}
function blankRow(){const tp=draftTpl();if(tp)return blankTplLine(tp);return S.draft.recipe==="timber"?{label:"",L:"",W:"",H:""}:{label:"",amount:"",kind:"pen"};}
function rowEmpty(l){return !Object.keys(l).some(k=>k[0]!=="_"&&k!=="kind"&&l[k]!==""&&l[k]!=null&&l[k]!==0);}
function keepScroll(fn){const y=window.scrollY;fn();requestAnimationFrame(()=>window.scrollTo(0,y));}
/* cut one row band into its strip and, if the book has column lines, into cells */
async function rowImages(y0,y1){const d=S.draft,tp=draftTpl();const out={_img:await cropRegion(d.photoData,0,y0,1,y1,820,true),_b:[y0,y1],_y:(y0+y1)/2};
  const cuts=tp&&tp.cuts&&tp.cuts.length===tp.cols.length-1?tp.cuts:null;
  if(cuts){const xs=[0].concat(cuts,[1]);const pad=(y1-y0)*0.08;out._cells=[];
    for(let j=0;j<tp.cols.length;j++)out._cells.push(await cropRegion(d.photoData,Math.max(0,xs[j]-0.01),y0+pad,Math.min(1,xs[j+1]+0.01),y1-pad,360,false));}
  return out;}
async function addRowAt(y0,y1){const d=S.draft;const imgs=await rowImages(y0,y1);if(!imgs._img)return;
  if(d.lines.length===1&&rowEmpty(d.lines[0])&&!d.lines[0]._img)d.lines=[];
  d.lines.push(Object.assign(blankRow(),imgs));d.lines.sort((a,b)=>(a._y==null?9:a._y)-(b._y==null?9:b._y));}
async function tapLine(ev){const d=S.draft;if(!d||!d.photoData||d.cutMode)return;const r=ev.currentTarget.getBoundingClientRect();
  const yf=(ev.clientY-r.top)/r.height;if(yf<0||yf>1)return;
  const half=0.05;await addRowAt(Math.max(0,yf-half),Math.min(1,yf+half));save();keepScroll(render);}
function okRow(i){const l=S.draft.lines[i];l._ok=!l._ok;delete l._unsure;save();keepScroll(render);}
function dropRow(i){S.draft.lines.splice(i,1);if(!S.draft.lines.length)S.draft.lines.push(blankRow());save();keepScroll(render);}
function totalRow(i){const d=S.draft,l=d.lines[i];d.totalImg=l._img;d.lines.splice(i,1);if(!d.lines.length)d.lines.push(blankRow());save();render();
  setTimeout(()=>{const f=document.getElementById('pagetotal');if(f){f.scrollIntoView({block:'center'});f.focus();}},60);}
function stripFor(i,l){if(!l._img)return '';
  return `<div class="strip"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><span class="chip num">${t('lineN').replace('{n}',i+1)}</span></div>
    <img src="${l._img}" alt="">
    <div class="sbtn"><button class="${l._ok?'on':''}" onclick="okRow(${i})">${l._ok?'✓ '+t('matches'):t('tapWhenMatch')}</button><button onclick="totalRow(${i})">Σ ${t('isTotal')}</button><button style="flex:0 0 40px" onclick="dropRow(${i})">✕</button></div></div>`;}

/* ---- seeing ink: pen strokes are darker / more coloured than the paper around them; long straight runs are ruled lines, not writing ---- */
async function inkMap(src){const im=await loadImg(src);if(!im)return null;const W=500,H=Math.round(im.height*W/im.width);
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.drawImage(im,0,0,W,H);const a=g.getImageData(0,0,W,H).data;
  const lum=new Float32Array(W*H),sat=new Float32Array(W*H);
  for(let i=0,p=0;p<W*H;p++,i+=4){const r=a[i],gg=a[i+1],b=a[i+2];lum[p]=0.3*r+0.59*gg+0.11*b;sat[p]=Math.max(r,gg,b)-Math.min(r,gg,b);}
  const B=20,bw=Math.ceil(W/B),bh=Math.ceil(H/B),bg=new Float32Array(bw*bh);
  for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){const v=[];for(let y=by*B;y<Math.min(H,by*B+B);y+=2)for(let x=bx*B;x<Math.min(W,bx*B+B);x+=2)v.push(lum[y*W+x]);v.sort((p,q)=>p-q);bg[by*bw+bx]=v[Math.floor(v.length*0.8)]||0;}
  const ink=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const p=y*W+x,b=bg[Math.floor(y/B)*bw+Math.floor(x/B)];if(b<110)continue;const dl=b-lum[p];if(dl>45||(sat[p]>70&&dl>20))ink[p]=1;}
  const kill=(len,horiz)=>{if(horiz){for(let y=0;y<H;y++){let x=0;while(x<W){if(!ink[y*W+x]){x++;continue;}let e=x;while(e<W&&ink[y*W+e])e++;if(e-x>len)for(let k=x;k<e;k++)ink[y*W+k]=0;x=e;}}}
    else{for(let x=0;x<W;x++){let y=0;while(y<H){if(!ink[y*W+x]){y++;continue;}let e=y;while(e<H&&ink[e*W+x])e++;if(e-y>len)for(let k=y;k<e;k++)ink[k*W+x]=0;y=e;}}}};
  kill(W*0.12,true);kill(H*0.12,false);
  return{W,H,ink};}
function findBands(m){const{W,H,ink}=m;const prof=new Float32Array(H);for(let y=0;y<H;y++){let s=0;for(let x=0;x<W;x++)s+=ink[y*W+x];prof[y]=s;}
  const sm=new Float32Array(H);for(let y=0;y<H;y++){let s=0,n=0;for(let k=-3;k<=3;k++){const yy=y+k;if(yy>=0&&yy<H){s+=prof[yy];n++;}}sm[y]=s/n;}
  const thr=Math.max(2,W*0.004);const bands=[];let y=0;
  while(y<H){if(sm[y]>thr){const y0=y;while(y<H&&sm[y]>thr)y++;if(y-y0>=6)bands.push([y0,y]);}y++;}
  const merged=[];bands.forEach(b=>{const l=merged[merged.length-1];if(l&&b[0]-l[1]<H*0.008)l[1]=b[1];else merged.push(b.slice());});
  const real=merged.filter(([a,b])=>{if(b-a>H*0.09)return false;const col=new Uint8Array(W);for(let y=a;y<b;y++)for(let x=0;x<W;x++)if(ink[y*W+x])col[x]=1;
    let clusters=0,run=0,gapRun=99,spread=0,first=-1,last=-1;
    for(let x=0;x<W;x++){if(col[x]){if(gapRun>W*0.04)clusters++;gapRun=0;if(first<0)first=x;last=x;spread++;}else gapRun++;}
    return clusters>=2&&(last-first)>W*0.3&&spread>W*0.06;});
  return real.map(([a,b])=>[a/H,b/H]);}
function findCuts(m,n){const{W,H,ink}=m;if(n<2)return [];const col=new Float32Array(W);for(let y=0;y<H;y++)for(let x=0;x<W;x++)col[x]+=ink[y*W+x];
  const on=[];for(let x=0;x<W;x++){let s=0,c=0;for(let k=-4;k<=4;k++){const xx=x+k;if(xx>=0&&xx<W){s+=col[xx];c++;}}on.push(s/c>1.5);}
  const segs=[];let x=0;while(x<W){if(on[x]){const x0=x;while(x<W&&on[x])x++;segs.push([x0,x]);}x++;}
  const gaps=[];for(let i=0;i<segs.length-1;i++)gaps.push({w:segs[i+1][0]-segs[i][1],c:(segs[i][1]+segs[i+1][0])/2/W});
  const even=Array.from({length:n-1},(_,i)=>(i+1)/n);
  if(gaps.length<n-1)return even;
  const cuts=gaps.sort((p,q)=>q.w-p.w).slice(0,n-1).map(g=>g.c).sort((p,q)=>p-q);
  const xs=[0].concat(cuts,[1]);for(let i=0;i<n;i++)if(xs[i+1]-xs[i]<0.12)return even; /* not convincing: even lines, owner drags */
  return cuts;}
async function findRowsForMe(){const d=S.draft;if(!d||!d.photoData)return;d.finding=true;save();keepScroll(render);
  const m=await inkMap(d.photoData);const bands=m?findBands(m):[];let added=0;
  for(const [a,b] of bands){const mid=(a+b)/2;if(d.lines.some(l=>l._b&&mid>l._b[0]&&mid<l._b[1]))continue;
    const h=Math.max(b-a,0.035);await addRowAt(Math.max(0,mid-h*0.75),Math.min(1,mid+h*0.75));added++;}

/* =====================================================================
   AI READING (Gemini, through our own Supabase function).
   Item pages only. Names and phone numbers never go: books with a customer
   column are typed, the reader is told to drop names/numbers, and anything
   that looks like a phone number is wiped on arrival.
   ===================================================================== */
const AI_URL=SUPA_URL+"/functions/v1/swift-handler";
const NAMEY=/\b(name|names|jina|majina|customer|mteja|wateja|client|phone|simu|tel|mobile)\b/i;
const PHONE_LIKE=/(\+?254|\b0)[17]\d{8}\b|\b\d{9,}\b/;
function aiTpl(d){const tp=draftTpl();if(tp)return tp;
  if(d.recipe==="timber")return{cols:["size"],custom:{}};
  if(d.recipe==="paidowed")return{cols:["item","amount","pay"],custom:{},pays:[{name:"Paid",owed:false},{name:"Owed",owed:true}]};
  return{cols:["item","amount"],custom:{}};}
function aiBlocked(tp){if(tp.cols.includes("who"))return true;return Object.keys(tp.custom||{}).some(k=>tp.cols.includes(k)&&tp.custom[k].kind==="text"&&NAMEY.test(tp.custom[k].name));}
function colLetter(j){return String.fromCharCode(65+j);}
/* decide what happens when a photo arrives at the review screen */
function startReading(){const d=S.draft;if(!d||!d.photoData){d&&(d.ocr=null);return;}
  d.tapMode=false;
  if(aiBlocked(aiTpl(d))){d.ocr="ai_blocked";return;}
  if(S.aiConsent===true){readAI();return;}
  if(S.aiConsent===false){d.ocr="ai_declined";return;}
  d.ocr="ai_ask";}
function aiYes(){S.aiConsent=true;save();readAI();}
function aiNo(){S.aiConsent=false;const d=S.draft;d.ocr="ai_declined";save();render();}
function aiAskAgain(){S.aiConsent=null;S.draft.ocr="ai_ask";save();render();}
async function readAI(){const d=S.draft;if(!d||!d.photoData)return;const tp=aiTpl(d);
  d.ocr="ai_reading";d.tapMode=false;save();if(S.screen==="review")render();
  const parts=d.photoData.split(",");const mime=(parts[0].match(/data:(.*?);/)||[])[1]||"image/jpeg";
  const columns=tp.cols.map(k=>({key:k,name:colName(k,tp),kind:kindOf(tp,k)}));
  let status=0,body={};
  try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),75000);
    const r=await fetch(AI_URL,{method:"POST",signal:ctl.signal,headers:{"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({image:parts[1],mime,columns,pays:(tp.pays||[]).map(p=>p.name)})});
    clearTimeout(to);status=r.status;body=await r.json().catch(()=>({}));}catch(e){status=0;}
  if(S.draft!==d)return;
  if(status===200&&body.ok&&body.table)applyAI(d,tp,body.table);
  else{d.ocr=status===429?"ai_busy":(status===404||body.error==="no_key")?"ai_off":status===0?"ai_net":"ai_fail";
    d.aiErr="HTTP "+status+(body.error?" · "+body.error:"")+(body.detail?" · "+String(body.detail).slice(0,160):"")+(body.message?" · "+String(body.message).slice(0,160):"")+(body.msg?" · "+String(body.msg).slice(0,160):"");}
  try{rpc('tracker_note',{p_app:'polaris-pro',p_screen:'review',p_kind:'ai_read',p_body:d.ocr+(body.model?' · '+body.model:''),p_phone:S.proPhone||null}).catch(()=>{});}catch(e){}
  save();if(S.screen==="review")render();}
function aiCell(cells,k){const c=cells&&cells[k];if(!c||typeof c!=="object")return{v:c==null?null:c,sure:c!=null};return{v:c.v,sure:c.sure!==false&&c.v!=null&&c.v!==""};}
function applyAI(d,tp,table){const rows=Array.isArray(table.rows)?table.rows:[];const out=[];
  rows.forEach((row,ri)=>{const l=blankTplLine(tp);l._uns={};l._n=row.n||ri+1;
    tp.cols.forEach(k=>{const kind=kindOf(tp,k);let{v,sure}=aiCell(row.cells,k);
      if(kind==="num"){const n=typeof v==="number"?v:num(v);l[k]=(v==null||v==="")?"":n;if(v!=null&&v!==""&&!isFinite(n))sure=false;}
      else if(kind==="size"){const m=String(v||"").match(/(\d+)\s*[x×X*]\s*(\d+)\s*[x×X*]\s*(\d+)/);if(m){l.size=m[1]+"x"+m[2]+"x"+m[3];l.L=+m[1];l.W=+m[2];l.H=+m[3];}else sure=false;}
      else if(kind==="pay"){const p=v?matchPay(tp,String(v)):null;l.pay=p?p.name:"";if(!p)sure=false;}
      else{let s=String(v==null?"":v).trim();if(PHONE_LIKE.test(s)){s="";sure=false;}l[k]=s;}
      if(!sure)l._uns[k]=true;});
    if(Object.keys(l).some(k=>k[0]!=="_"&&l[k]!==""))out.push(l);});
  let lines=out;
  if(!draftTpl()){lines=out.map(l=>{const u=Object.keys(l._uns).length>0;
    if(d.recipe==="timber")return{label:l.size||"",L:l.L,W:l.W,H:l.H,_n:l._n,_unsure:u};
    return{label:l.item||"",amount:l.amount,kind:d.recipe==="paidowed"&&l.pay==="Owed"?"pencil":"pen",_n:l._n,_unsure:u};});}
  const pt=table.pageTotal&&typeof table.pageTotal==="object"?table.pageTotal.v:table.pageTotal;
  if(pt!=null&&isFinite(num(pt))&&num(pt)>0)d.pageTotal=num(pt);
  if(!lines.length){d.ocr="ai_none";return;}
  d.lines=lines;
  const total=draftTotals().total;const flags=flaggedCells().length;
  if(d.pageTotal&&Math.round(d.pageTotal-total)===0&&!flags){d.lines.forEach(l=>l._ok=true);d.ocr="ai_match";}else d.ocr="ai_done";}
/* every square that still needs the owner, in chess-style addresses: C2, B4 */
function flaggedCells(){const d=S.draft;if(!d)return [];const tp=draftTpl();const out=[];
  d.lines.forEach((l,i)=>{if(rowEmpty(l)&&!l._img)return;
    if(tp)tp.cols.forEach((k,j)=>{if(cellEmpty(tp,l,k)||(l._uns&&l._uns[k]))out.push(colLetter(j)+(i+1));});
    else if(l._unsure)out.push("#"+(i+1));});
  return out;}
function tickAll(){S.draft.lines.forEach(l=>{if(!rowEmpty(l))l._ok=true;});save();keepScroll(render);}
function aiBlock(){const d=S.draft;const retry=`<a href="#" onclick="readAI();return false">${t('tryAgain')}</a>`;
  switch(d.ocr){
    case "ai_ask":return `<div class="card" style="border-color:#bcd6c7;background:#f3f9f5"><b>✨ ${t('aiAskT')}</b>
      <p style="font-size:14px;color:var(--ink);margin:6px 0">${t('aiAskB')}</p><p class="hint" style="margin:0 0 10px">🔒 ${t('aiAskPriv')}</p>
      <button class="btn" style="margin-top:0" onclick="aiYes()">${t('aiYes')}</button><button class="btn sec" style="margin-top:8px" onclick="aiNo()">${t('aiNo')}</button></div>`;
    case "ai_reading":return `<div class="priv" id="ocrstat"><div>✨</div><div>${t('aiReading')}</div></div>`;
    case "ai_match":return `<div class="priv" style="background:#e6f1ea;border-color:#9cc3ad"><div>✅</div><div>${t('aiMatch')}</div></div>`;
    case "ai_done":return `<div class="priv"><div>✨</div><div>${t('aiDone')} ${retry}</div></div>`;
    case "ai_busy":return `<div class="card" style="background:#fbf3e6;border-color:#ecd9b8"><b>⏳ ${t('aiBusyT')}</b>
      <p style="font-family:ui-monospace,monospace;font-size:12px;color:#6b4a22;word-break:break-all;margin:6px 0 10px">${esc(d.aiErr||'')}</p>
      <button class="btn" style="margin-top:0" onclick="readAI()">↻ ${t('tryAgainBtn')}</button></div>`;
    case "ai_off":return `<div class="priv"><div>✎</div><div>${t('aiOff')} ${retry}<br><small style="font-family:ui-monospace,monospace;color:var(--muted);word-break:break-all">${esc(d.aiErr||'')}</small></div></div>`;
    case "ai_net":return `<div class="card" style="background:#fbf3e6;border-color:#ecd9b8"><b>📶 ${t('aiNetT')}</b>
      <button class="btn" style="margin-top:10px" onclick="readAI()">↻ ${t('tryAgainBtn')}</button></div>`;
    case "ai_fail":return `<div class="card" style="background:#fbf3e6;border-color:#ecd9b8"><b>⚠ ${t('aiFail')}</b>
      <p style="font-family:ui-monospace,monospace;font-size:12px;color:#6b4a22;word-break:break-all;margin:6px 0 10px">${esc(d.aiErr||'')}</p>
      <button class="btn" style="margin-top:0" onclick="readAI()">↻ ${t('tryAgainBtn')}</button><p class="hint" style="margin:8px 0 0">${t('orType')}</p></div>`;
    case "ai_none":return `<div class="priv"><div>🔍</div><div>${t('aiNone')} ${retry}</div></div>`;
    case "ai_blocked":return `<div class="priv"><div>🔒</div><div>${t('aiBlocked')}</div></div>`;
    case "ai_declined":return `<div class="priv"><div>✎</div><div>${t('aiDeclinedT')} <a href="#" onclick="aiAskAgain();return false">${t('aiUseInstead')}</a></div></div>`;
  }
  return "";}

function trkFor(sc){return TRK[sc]||TRK["default"];}

var trkMsgs=[];
function kbAnswer(q){q=(q||'').toLowerCase();for(var i=0;i<KB.length;i++){for(var j=0;j<KB[i].k.length;j++){if(q.indexOf(KB[i].k[j])>-1)return KB[i];}}return null;}
function closeTracker(){var p=document.getElementById('trackerpanel');if(p)p.style.display='none';}
function silenceCompass(){S.trackerOff=true;save();closeTracker();refreshCompass();}
function openTracker(){
  var p=document.getElementById('trackerpanel'),sh=document.getElementById('tsheet');if(!p||!sh)return;var sw=(S.lang==='sw');
  sh.innerHTML='<div class="chead"><div class="av">🧭</div><div class="ti"><b>'+t('trkTitle')+'</b><small>'+(sw?'Papo hapa':'Online, here to help')+'</small></div><span class="cl" onclick="silenceCompass()" title="Silence">🔕</span><span class="cl" onclick="closeTracker()">'+t('trkClose')+'</span></div>'
    +'<div class="cbody" id="cbody"></div><div class="chips" id="cchips"></div>'
    +'<div class="cin"><input id="cinput" placeholder="'+(sw?'Niulize chochote…':'Ask me anything…')+'" onkeydown="if(event.key===\'Enter\')trkAsk()"><button onclick="trkAsk()">➤</button></div>';
  trkMsgs=[{who:'bot',text:(sw?'Mimi ni dira yako 🧭 — niulize chochote kuhusu Polaris, au gonga swali hapa chini.':'I’m your compass 🧭 — ask me anything about Polaris, or tap a question below.')}];
  renderChat();renderChips();p.style.display='flex';
  setTimeout(function(){var ci=document.getElementById('cinput');if(ci)ci.focus();},200);
}
function renderChips(){var c=document.getElementById('cchips');if(!c)return;var sw=(S.lang==='sw');
  var qs=sw?['Jinsi ya kuandika mauzo?','Malipo yanafanyaje?','Kwa nini kusubiri uthibitisho?','Viwanda ni nini?','Sakinisha app']:['How do I record a sale?','How do payments work?','Why wait for confirmation?','What is Viwanda?','Install the app'];
  c.innerHTML=qs.map(function(x){return '<button class="chip2" onclick="trkChip(this)">'+x+'</button>';}).join('');}
function trkChip(b){var ci=document.getElementById('cinput');if(ci){ci.value=b.textContent;trkAsk();}}
function renderChat(){var b=document.getElementById('cbody');if(!b)return;
  b.innerHTML=trkMsgs.map(function(m){if(m.typing)return '<div class="typing"><span></span><span></span><span></span></div>';var acts=m.acts?('<div class="acts">'+m.acts+'</div>'):'';return '<div class="msg '+(m.who==='me'?'me':'bot')+'">'+m.text+acts+'</div>';}).join('');
  b.scrollTop=b.scrollHeight;}
function trkAsk(){
  var ci=document.getElementById('cinput');if(!ci)return;var q=(ci.value||'').trim();if(!q)return;ci.value='';
  trkMsgs.push({who:'me',text:q});trkMsgs.push({typing:true});renderChat();
  setTimeout(function(){
    for(var i=trkMsgs.length-1;i>=0;i--){if(trkMsgs[i].typing){trkMsgs.splice(i,1);break;}}
    var sw=(S.lang==='sw'),hit=kbAnswer(q);
    if(hit){var acts='';if(hit.act){acts=hit.act.map(function(a){var label=a.t?(sw?a.t.sw:a.t.en):(sw?'Fungua':'Open');if(a.go)return '<button onclick="trkDo(\'go\',\''+a.go+'\')">'+label+'</button>';if(a.link)return '<button onclick="trkDo(\'link\',\''+a.link+'\')">'+label+'</button>';return '';}).join('');}
      trkMsgs.push({who:'bot',text:(sw?hit.a.sw:hit.a.en),acts:acts});}
    else{try{rpc('tracker_note',{p_app:'polaris-pro',p_screen:S.screen,p_kind:'question',p_body:q,p_phone:S.proPhone||null}).catch(function(){});}catch(e){}
      trkMsgs.push({who:'bot',text:(sw?'Hilo sijalijua bado — nimelipeleka kwa timu ili niongezwe. Wakati huo huo:':'I don’t know that one yet — I’ve sent it to the team so I can learn it. Meanwhile:'),acts:'<button onclick="trkDo(\'link\',\'community\')">'+(sw?'Jiunge na jamii':'Join community')+'</button><button onclick="trkDo(\'link\',\'wa\')">'+(sw?'Tutumie':'Message us')+'</button>'});}
    renderChat();
  },480);
}
function trkDo(kind,val){var tops=['home','records','explore','pro','more'];
  if(kind==='go'){closeTracker();if(tops.indexOf(val)>-1)goTab(val);else go(val);}
  else if(kind==='link'){var map={viwanda:CFG.viwandaUrl,polaris:CFG.polarisFreeUrl,community:COMMUNITY,wa:WA};openLink(map[val]||val);}}
function showTrackerIntro(){
  if(S.seenTracker||!compassEligible())return;
  var m=document.getElementById('trackerintro');if(!m)return;
  document.getElementById('ti-title').textContent=t('trkIntroTitle');
  document.getElementById('ti-sub').textContent=t('trkIntroSub');
  var ok=document.getElementById('ti-ok');ok.textContent=t('gotIt');
  ok.onclick=function(){S.seenTracker=true;save();m.style.display='none';refreshCompass();};
  m.style.display='flex';
}

function render(){
  const flow={capture:screen_capture,recipe:screen_recipe,review:screen_review,result:screen_result,branches:screen_branches,privacy:screen_privacy,share:screen_share,safe:screen_safe,tb1:screen_tb1,tb2:screen_tb2,tb3:screen_tb3,tb4:screen_tb4,recview:screen_recview};
  const top={home:page_home,records:page_records,explore:page_explore,pro:page_pro,more:page_more};
  let html;
  try{
    if(needsDraft(S.screen)){S.screen="home";S.hist=[];save();}
    if(TOP.includes(S.screen)){html=topbar("Polaris Pro",{noback:true})+top[S.screen]()+tabbar();}
    else{html=(flow[S.screen]||page_home)();}
  }catch(err){console.error(err);S.screen="home";S.hist=[];S.draft=null;S.recipeChoice=null;if(S.tour)S.tour.active=false;save();
    html=topbar("Polaris Pro",{noback:true})+page_home()+tabbar();}
  let ov='';try{ov=tourOverlay();}catch(err){if(S.tour)S.tour.active=false;save();}
  document.getElementById("app").innerHTML=html+ov;window.scrollTo(0,0);
  try{refreshCompass();}catch(err){}
}
render();
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw%20(1).js').catch(function(){});});}

/* ---- install nudge (keeps popping until installed) ---- */
var deferredPrompt=null;
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function installEligible(){return !isStandalone() && !localStorage.getItem('pp_installed') && !(S.tour&&S.tour.active);}
function showInstallModal(){
  if(!installEligible())return;
  var m=document.getElementById('installmodal');if(!m)return;
  var sw=(S.lang==='sw');
  document.getElementById('im-title').textContent=sw?'Sakinisha Polaris Pro':'Install Polaris Pro';
  document.getElementById('im-sub').textContent=sw?'Iweke kwenye skrini yako kama programu — inafunguka haraka, hata bila mtandao.':'Add it to your home screen like an app — opens fast, even offline.';
  var ib=document.getElementById('im-install');ib.textContent=sw?'Sakinisha sasa':'Install now';ib.onclick=installClick;
  var lb=document.getElementById('im-later');lb.textContent=sw?'Baadaye':'Not now';lb.onclick=function(){m.style.display='none';};
  m.style.display='flex';
}
function hideInstallModal(){var m=document.getElementById('installmodal');if(m)m.style.display='none';}
function installClick(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(c){if(c&&c.outcome==='accepted'){localStorage.setItem('pp_installed','1');hideInstallModal();}deferredPrompt=null;});}
  else{alert((S.lang==='sw')?'Fungua kwenye Chrome → menyu (⋮) → Sakinisha programu / Ongeza kwenye skrini':'Open in Chrome → menu (⋮) → Install app / Add to Home screen');}
}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;localStorage.removeItem('pp_installed');showInstallModal();});
/* two windows open (browser tab + installed app): keep them in step instead of one overwriting the other */
window.addEventListener('storage',function(e){if(e.key!=='pp_state'||!e.newValue)return;try{const keepScreen=S.screen,keepHist=S.hist,keepDraft=S.draft;S=migrate(JSON.parse(e.newValue));S.screen=keepScreen;S.hist=keepHist;S.draft=keepDraft;if(!(document.activeElement&&document.activeElement.tagName==='INPUT'))render();}catch(x){}});
askPersist();
window.addEventListener('appinstalled',function(){localStorage.setItem('pp_installed','1');deferredPrompt=null;hideInstallModal();});
setTimeout(function(){var m=document.getElementById('installmodal');if(installEligible()&&m&&m.style.display!=='flex')showInstallModal();},3500);
if(S.proPhone){checkPro(true);}
if(S.bookedAI&&S.bookedSent===false){rpc('tracker_note',{p_app:'polaris-pro',p_screen:'pro',p_kind:'booking',p_body:'AI handwriting reading: booked',p_phone:S.bookedAI}).then(function(){S.bookedSent=true;save();}).catch(function(){});}
refreshCompass();
try{rpc('tracker_enabled',{p_app:'polaris-pro'}).then(function(v){trackerEnabled=(v!==false);refreshCompass();}).catch(function(){});}catch(e){}
setTimeout(function(){var im=document.getElementById('installmodal');if(im&&im.style.display!=='flex')showTrackerIntro();},1400);
</script>
